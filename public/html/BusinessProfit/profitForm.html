<!-- Business Profit Form Modal -->
<div class="modal-dialog modal-dialog-scrollable" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-success text-white">
      <h5 class="modal-title" id="profitFormModalTitle">
        <i class="fas fa-coins me-2"></i><span>Profit Record</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">
      <form id="profitForm" novalidate>
        <input type="hidden" id="inputProfitId">

        <div class="border rounded p-3 mb-4 bg-light">
          <h6 class="text-success fw-bold mb-3">
            <i class="fas fa-calendar-alt me-1"></i> Period & Configuration
          </h6>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label small text-muted" for="inputPeriodStart">Period Start <span class="text-danger">*</span></label>
              <input class="form-control" id="inputPeriodStart" type="date" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted" for="inputPeriodEnd">Period End <span class="text-danger">*</span></label>
              <input class="form-control" id="inputPeriodEnd" type="date" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted" for="inputSafetyNetPercent">Safety Net % <span class="text-danger">*</span></label>
              <div class="input-group">
                <input class="form-control" id="inputSafetyNetPercent" type="number"
                       step="0.01" min="0" max="100" placeholder="0.00" required>
                <span class="input-group-text"><i class="fas fa-percent"></i></span>
              </div>
            </div>
          </div>
          <p class="text-muted small mt-2 mb-0">
            <i class="fas fa-info-circle me-1"></i>
            The system will auto-calculate P&L from your transactions in this period. Safety Net is the % retained for operations before distributing to partners.
          </p>
        </div>

      </form>
    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i>Cancel
      </button>
      <button class="btn btn-success" type="button" data-action="profit.save">
        <i class="fas fa-save me-1"></i>Save
      </button>
    </div>

  </div>
</div>
