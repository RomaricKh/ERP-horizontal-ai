<!-- Business Profit Detail Modal -->
<div class="modal-dialog modal-lg modal-dialog-scrollable" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-success text-white">
      <h5 class="modal-title">
        <i class="fas fa-chart-bar me-2"></i><span>P&L Breakdown</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">

      <!-- Period & Status -->
      <div class="border rounded p-3 mb-4 bg-light">
        <div class="row g-3">
          <div class="col-md-8">
            <small class="text-muted d-block">Period</small>
            <strong id="detailPeriod">—</strong>
          </div>
          <div class="col-md-4 text-end">
            <small class="text-muted d-block">Status</small>
            <span id="detailStatus">—</span>
          </div>
        </div>
      </div>

      <!-- P&L Card -->
      <div class="border rounded p-3 mb-4">
        <h6 class="text-success fw-bold mb-3"><i class="fas fa-file-invoice-dollar me-1"></i> Income Statement</h6>
        <div class="row g-2">
          <div class="col-6"><span class="text-muted small">Revenue</span></div>
          <div class="col-6 text-end fw-semibold text-success" id="detailRevenue">0.00</div>

          <div class="col-6"><span class="text-muted small">COGS</span></div>
          <div class="col-6 text-end fw-semibold text-danger" id="detailCogs">0.00</div>

          <div class="col-12"><hr class="my-1"></div>

          <div class="col-6"><strong>Gross Profit</strong></div>
          <div class="col-6 text-end fw-bold" id="detailGrossProfit">0.00</div>

          <div class="col-12"><hr class="my-1"></div>

          <div class="col-6"><span class="text-muted small">Expenses</span></div>
          <div class="col-6 text-end text-danger" id="detailExpenses">0.00</div>

          <div class="col-6"><span class="text-muted small">Salaries</span></div>
          <div class="col-6 text-end text-danger" id="detailSalaries">0.00</div>

          <div class="col-12"><hr class="my-1"></div>

          <div class="col-6"><strong>Net Profit</strong></div>
          <div class="col-6 text-end fw-bold fs-5" id="detailNetProfit">0.00</div>
        </div>
      </div>

      <!-- Distribution Section -->
      <div class="border rounded p-3 mb-4">
        <h6 class="text-success fw-bold mb-3"><i class="fas fa-share-alt me-1"></i> Distribution</h6>
        <div class="row g-2 mb-3">
          <div class="col-4"><span class="text-muted small">Safety Net %</span><br><strong id="detailSafetyNetPct">0%</strong></div>
          <div class="col-4"><span class="text-muted small">Safety Net Amount</span><br><strong id="detailSafetyNetAmt">0.00</strong></div>
          <div class="col-4"><span class="text-muted small">Distributable</span><br><strong class="text-success fs-5" id="detailDistributable">0.00</strong></div>
        </div>

        <div id="distributionSection" class="d-none">
          <h6 class="fw-bold small mb-2">Partner Breakdown</h6>
          <div class="table-responsive">
            <table class="table table-sm table-bordered mb-0" id="distributionTable">
              <thead class="table-light">
                <tr>
                  <th>Partner</th>
                  <th class="text-end">Share %</th>
                  <th class="text-end">Amount</th>
                  <th>Payment Slip</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i>Close
      </button>
    </div>

  </div>
</div>
