<!-- Page Heading -->
<h1 class="h3 mb-2 text-gray-800">Business Profit</h1>

<!-- Profit DataTable -->
<div class="card shadow mb-4">
    <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
        <h6 class="m-0 font-weight-bold text-primary">Profit Records</h6>
        <div class="d-flex gap-2">
            <button class="btn btn-success btn-icon-split btn-sm" data-action="profit.create" title="Add a new profit record">
                <span class="text">Add Profit Record</span>
                <span class="icon"><i class="fas fa-fw fa-plus"></i></span>
            </button>
        </div>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover"
                   id="profitTable" width="100%" cellspacing="0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Period</th>
                        <th>Revenue</th>
                        <th>COGS</th>
                        <th>Gross Profit</th>
                        <th>Expenses</th>
                        <th>Net Profit</th>
                        <th>Distributable</th>
                        <th>Status</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>
