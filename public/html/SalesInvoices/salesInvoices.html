<!-- Page Heading -->
<h1 class="h3 mb-2 text-gray-800" data-i18n="invoices.title">Sales Invoices</h1>

<!-- Sales Invoices DataTable -->
<div class="card shadow mb-4">
    <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
        <h6 class="m-0 font-weight-bold text-primary" data-i18n="invoices.heading">Sales Invoices</h6>
        <div class="d-flex gap-2">
            <button class="btn btn-primary btn-icon-split btn-sm"
                    data-action="invoice.create" title="Create a new sales invoice">
                <span class="text" data-i18n="invoices.new_btn">New Invoice</span>
                <span class="icon"><i class="fas fa-fw fa-plus"></i></span>
            </button>
        </div>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover row-border"
                   id="salesInvoicesTable" width="100%" cellspacing="0">
                <thead>
                    <tr>
                        <th data-i18n="common.id">ID</th>
                        <th data-i18n="invoices.invoice_number">Inv#</th>
                        <th data-i18n="common.customer">Customer</th>
                        <th data-i18n="common.date">Date</th>
                        <th data-i18n="common.status">Status</th>
                        <th>Total</th>
                        <th>Returns</th>
                        <th>Collected</th>
                        <th>Balance</th>
                        <th data-i18n="common.actions">Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>
