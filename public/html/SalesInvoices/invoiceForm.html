<!-- Invoice Form Modal -->
<div class="modal-dialog modal-xl modal-dialog-scrollable" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-primary text-white">
      <h5 class="modal-title" id="invoiceModalTitle">
        <i class="fas fa-file-invoice me-2"></i><span data-i18n="invoices.form_title">New Sales Invoice</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">

      <!-- Header Section -->
      <div class="border rounded p-3 mb-4 bg-light">
        <h6 class="text-primary fw-bold mb-3">
          <i class="fas fa-info-circle me-1"></i> <span data-i18n="invoices.details_heading">Invoice Details</span>
        </h6>
        <form id="invoiceHeaderForm" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputInvoiceCustomer" data-i18n="common.customer">Customer</label>
              <select class="form-select" id="inputInvoiceCustomer">
                <option value="" data-i18n="invoices.select_customer">— Select customer —</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputInvoiceNumber"><span data-i18n="invoices.invoice_number">Invoice #</span></label>
              <input class="form-control" id="inputInvoiceNumber" type="text"
                     data-i18n-placeholder="invoices.invoice_number_placeholder" placeholder="Auto-generated on save" required>
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted" for="inputInvoiceDate"><span data-i18n="invoices.invoice_date">Date</span> <span class="text-danger">*</span></label>
              <input class="form-control" id="inputInvoiceDate" type="date" required>
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted" for="inputInvoiceDueDate"><span data-i18n="invoices.due_date">Due Date</span></label>
              <input class="form-control" id="inputInvoiceDueDate" type="date">
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted" for="inputInvoiceCurrency"><span data-i18n="common.currency">Currency</span> <span class="text-danger">*</span></label>
              <select class="form-select" id="inputInvoiceCurrency" required>
                <option value="">Select</option>
                <option value="USD">USD</option><option value="EUR">EUR</option><option value="GBP">GBP</option>
                <option value="LBP">LBP</option><option value="AED">AED</option><option value="SAR">SAR</option>
                <option value="EGP">EGP</option><option value="JOD">JOD</option><option value="KWD">KWD</option><option value="TRY">TRY</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted" for="inputInvoiceExchangeRate"><span data-i18n="common.exchange_rate">Rate</span> <span class="text-danger">*</span></label>
              <input class="form-control" id="inputInvoiceExchangeRate" type="number" step="0.000001" min="0" placeholder="1.000000" required>
            </div>
            <div class="col-12">
              <label class="form-label small text-muted" for="inputInvoiceNotes" data-i18n="common.notes">Notes</label>
              <textarea class="form-control" id="inputInvoiceNotes" rows="2" data-i18n-placeholder="common.optional_notes" placeholder="Optional notes"></textarea>
            </div>
          </div>
        </form>
      </div>

      <!-- Line Items Section -->
      <div class="border rounded p-3 mb-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h6 class="text-primary fw-bold mb-0">
            <i class="fas fa-list me-1"></i> <span data-i18n="invoices.line_items">Line Items</span>
          </h6>
          <button class="btn btn-outline-primary btn-sm" type="button" data-action="invoice.add-line">
            <i class="fas fa-plus me-1"></i><span data-i18n="invoices.add_line">Add Line</span>
          </button>
        </div>
        <div class="table-responsive">
          <table class="table table-bordered table-sm mb-0" id="invoiceLinesTable">
            <thead class="table-light">
              <tr>
                <th style="min-width:120px" id="lineTypeHeader" class="d-none">Type</th>
                <th style="min-width:180px" id="lineItemServiceHeader">Item/Service</th>
                <th style="min-width:100px">Qty</th>
                <th style="min-width:110px">Price (FC)</th>
                <th style="min-width:110px">Price (BC)</th>
                <th style="min-width:80px">Tax %</th>
                <th style="min-width:80px">Disc %</th>
                <th style="min-width:110px">Total (FC)</th>
                <th style="width:45px"></th>
              </tr>
            </thead>
            <tbody id="invoiceLinesBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Totals -->
      <div class="d-flex justify-content-end">
        <div class="border rounded p-3 bg-light" style="min-width:280px;">
          <div class="d-flex justify-content-between mb-1"><span class="text-muted small">Subtotal (FC)</span><span class="fw-semibold" id="invoiceSubtotalFc">0.00</span></div>
          <div class="d-flex justify-content-between mb-1"><span class="text-muted small">Tax (FC)</span><span class="fw-semibold" id="invoiceTaxTotalFc">0.00</span></div>
          <hr class="my-1">
          <div class="d-flex justify-content-between mb-2"><span class="fw-bold">Grand Total (FC)</span><span class="fs-5 fw-bold text-primary" id="invoiceGrandTotalFc">0.00</span></div>
          <div class="d-flex justify-content-between mb-1"><span class="text-muted small">Subtotal (BC)</span><span class="fw-semibold" id="invoiceSubtotalBc">0.00</span></div>
          <div class="d-flex justify-content-between mb-1"><span class="text-muted small">Tax (BC)</span><span class="fw-semibold" id="invoiceTaxTotalBc">0.00</span></div>
          <hr class="my-1">
          <div class="d-flex justify-content-between"><span class="fw-bold">Grand Total (BC)</span><span class="fs-6 fw-bold text-secondary" id="invoiceGrandTotalBc">0.00</span></div>
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal"><i class="fas fa-times me-1"></i><span data-i18n="common.close">Close</span></button>
      <button class="btn btn-primary" type="button" data-action="invoice.save"><i class="fas fa-save me-1"></i><span data-i18n="invoices.save_btn">Save Invoice</span></button>
    </div>

  </div>
</div>
