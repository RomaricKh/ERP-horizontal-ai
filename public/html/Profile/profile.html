<!-- Page Heading -->
<div class="d-flex align-items-center justify-content-between mb-3">
    <h1 class="h3 mb-0 text-gray-800" data-i18n="profile.title">My Profile</h1>
</div>

<!-- Profile Info Card -->
<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary" data-i18n="profile.info_heading">Profile Information</h6>
    </div>
    <div class="card-body">
        <form id="profileForm" novalidate>

            <!-- Username (read-only) -->
            <div class="mb-3">
                <label for="profileUsername" class="form-label fw-semibold" data-i18n="profile.username">Username</label>
                <input type="text" id="profileUsername" class="form-control" readonly disabled>
                <div class="form-text text-muted" data-i18n="profile.username_help">Username cannot be changed.</div>
            </div>

            <div class="row">
                <!-- First Name -->
                <div class="col-md-6 mb-3">
                    <label for="profileFirstName" class="form-label fw-semibold" data-i18n="profile.first_name">First Name</label>
                    <input type="text" id="profileFirstName" name="first_name" class="form-control" required>
                </div>

                <!-- Last Name -->
                <div class="col-md-6 mb-3">
                    <label for="profileLastName" class="form-label fw-semibold" data-i18n="profile.last_name">Last Name</label>
                    <input type="text" id="profileLastName" name="last_name" class="form-control" required>
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="profileEmail" class="form-label fw-semibold" data-i18n="profile.email">Email</label>
                <input type="email" id="profileEmail" name="email" class="form-control" required>
            </div>

            <!-- Save Button -->
            <div class="d-flex justify-content-end">
                <button type="button" class="btn btn-primary" data-action="profile.save">
                    <i class="fas fa-fw fa-save"></i> <span data-i18n="profile.save_btn">Save</span>
                </button>
            </div>

        </form>
    </div>
</div>

<!-- Change Password Card -->
<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary" data-i18n="profile.password_heading">Change Password</h6>
    </div>
    <div class="card-body">
        <form id="passwordForm" novalidate>

            <!-- Current Password -->
            <div class="mb-3">
                <label for="profileCurrentPassword" class="form-label fw-semibold" data-i18n="profile.current_password">Current Password</label>
                <input type="password" id="profileCurrentPassword" name="current_password" class="form-control" required>
            </div>

            <!-- New Password -->
            <div class="mb-3">
                <label for="profileNewPassword" class="form-label fw-semibold" data-i18n="profile.new_password">New Password</label>
                <input type="password" id="profileNewPassword" name="new_password" class="form-control" required minlength="8">
                <div class="form-text text-muted" data-i18n="profile.new_password_help">Minimum 8 characters.</div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
                <label for="profileConfirmPassword" class="form-label fw-semibold" data-i18n="profile.confirm_password">Confirm Password</label>
                <input type="password" id="profileConfirmPassword" name="confirm_password" class="form-control" required minlength="8">
            </div>

            <!-- Update Password Button -->
            <div class="d-flex justify-content-end">
                <button type="button" class="btn btn-warning" data-action="profile.changePassword">
                    <i class="fas fa-fw fa-key"></i> <span data-i18n="profile.update_password_btn">Update Password</span>
                </button>
            </div>

        </form>
    </div>
</div>
