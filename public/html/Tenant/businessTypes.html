<!-- Page Heading -->
<h1 class="h3 mb-2 text-gray-800">Business Types</h1>

<!-- DataTable Card -->
<div class="card shadow mb-4">
	<div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
		<h6 class="m-0 font-weight-bold text-primary">Manage Business Types</h6>
		<button class="btn btn-primary btn-icon-split btn-sm" data-action="businessTypes.create"
				data-bs-toggle="tooltip" data-bs-placement="top" title="Create a new business type from a system template">
			<span class="text">Create from Template</span>
			<span class="icon"><i class="fas fa-fw fa-plus"></i></span>
		</button>
	</div>
	<div class="card-body">
		<div class="table-responsive">
			<table class="table table-bordered table-striped table-hover row-border"
				   id="businessTypesTable" width="100%" cellspacing="0">
				<thead>
					<tr>
						<th>ID</th>
						<th>Name</th>
						<th>Code</th>
						<th>Modules</th>
						<th>Actions</th>
					</tr>
				</thead>
				<tbody></tbody>
			</table>
		</div>
	</div>
</div>

<!-- Module Toggle Modal (inline) -->
<div class="modal fade" id="moduleToggleModal" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Manage Modules</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<p class="text-muted mb-3">Toggle modules on/off for this business type. Changes affect all businesses using this type.</p>
				<div id="moduleToggleList" class="row"></div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
				<button type="button" class="btn btn-primary" data-action="businessTypes.saveModules">Save Modules</button>
			</div>
		</div>
	</div>
</div>
