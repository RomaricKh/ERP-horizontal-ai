<!-- Page Heading -->
<h1 class="h3 mb-2 text-gray-800">Tenant Reports</h1>

<div class="card shadow mb-4">
	<div class="card-header py-3">
		<h6 class="m-0 font-weight-bold text-primary">Generate Cross-Business Report</h6>
	</div>
	<div class="card-body">
		<div class="row g-3 align-items-end mb-4">
			<div class="col-md-3">
				<label class="form-label small text-muted" for="inputReportType">Report Type <span class="text-danger">*</span></label>
				<select class="form-select" id="inputReportType">
					<option value="">— Select —</option>
					<option value="profit-and-loss">Profit &amp; Loss</option>
					<option value="balance-sheet">Balance Sheet</option>
					<option value="cash-flow">Cash Flow</option>
					<option value="accounts-receivable-aging">AR Aging</option>
					<option value="accounts-payable-aging">AP Aging</option>
					<option value="user-activity-summary">Activity Summary</option>
				</select>
			</div>
			<div class="col-md-2">
				<label class="form-label small text-muted" for="inputReportFrom">Start Date <span class="text-danger">*</span></label>
				<input class="form-control" id="inputReportFrom" type="date">
			</div>
			<div class="col-md-2">
				<label class="form-label small text-muted" for="inputReportTo">End Date <span class="text-danger">*</span></label>
				<input class="form-control" id="inputReportTo" type="date">
			</div>
			<div class="col-md-2">
				<button class="btn btn-primary w-100" data-action="tenant-reports.generate">
					<i class="fas fa-file-alt me-1"></i>Generate
				</button>
			</div>
		</div>

		<!-- Report Results -->
		<div id="reportResults">
			<div class="text-muted text-center py-4">Select a report type and click Generate to view results.</div>
		</div>
	</div>
</div>
