<!-- Designate Tenant Owner modal -->
<div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-dark text-white">
      <h5 class="modal-title" id="ownerModalTitle">
        <i class="fas fa-crown me-2"></i>Designate Tenant Owner
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">
      <form>

        <!-- Lookup Section -->
        <div class="border rounded p-3 mb-4 bg-light">
          <h6 class="text-dark fw-bold mb-3">
            <i class="fas fa-search me-1"></i> Find User
          </h6>
          <p class="text-muted small mb-3">
            Enter email or username to look up an existing user. If not found, a new account will be created.
          </p>
          <div class="row g-3" id="ownerLookupFields">
            <div class="col-md-6">
              <label class="form-label small text-muted" for="ownerInputEmail">Email <span class="text-danger">*</span></label>
              <input class="form-control" id="ownerInputEmail" type="email" placeholder="Enter email address">
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted" for="ownerInputUsername">Username <span class="text-danger">*</span></label>
              <input class="form-control" id="ownerInputUsername" type="text" placeholder="Enter username">
            </div>
            <div class="col-12">
              <div class="form-text" id="ownerLookupFeedback"></div>
            </div>
          </div>
        </div>

        <!-- Identity Section -->
        <div class="border rounded p-3 mb-4">
          <h6 class="text-dark fw-bold mb-3">
            <i class="fas fa-user me-1"></i> Identity
          </h6>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small text-muted" for="ownerInputFirstName">First name <span class="text-danger">*</span></label>
              <input class="form-control" id="ownerInputFirstName" type="text" placeholder="Enter first name">
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted" for="ownerInputLastName">Last name <span class="text-danger">*</span></label>
              <input class="form-control" id="ownerInputLastName" type="text" placeholder="Enter last name">
            </div>
          </div>
        </div>

        <!-- Password Section -->
        <div class="border rounded p-3 mb-4">
          <h6 class="text-dark fw-bold mb-3">
            <i class="fas fa-key me-1"></i> Password
          </h6>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small text-muted" for="ownerInputPassword">Password <span class="text-danger">*</span></label>
              <input class="form-control" id="ownerInputPassword" type="password" placeholder="Enter password">
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted" for="ownerInputConfirmPass">Confirm <span class="text-danger">*</span></label>
              <input class="form-control" id="ownerInputConfirmPass" type="password" placeholder="Confirm password">
            </div>
          </div>
        </div>

        <!-- Info alert for existing users -->
        <div class="alert alert-info d-none" id="ownerExistingUserAlert">
          <i class="fas fa-info-circle me-1"></i>
          This user already exists and will be promoted to Tenant Owner. Password fields are not required.
        </div>

      </form>
    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i>Cancel
      </button>
      <button class="btn btn-dark" type="button" data-action="tenant-owners.save" id="ownerSaveBtn">
        <i class="fas fa-crown me-1"></i> Designate Owner
      </button>
    </div>

  </div>
</div>
