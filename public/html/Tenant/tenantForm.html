<!-- Tenant form modal -->
<div class="modal-dialog" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-dark text-white">
      <h5 class="modal-title" id="tenantModalTitle">
        <i class="fas fa-building me-2"></i>Create Tenant
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">
      <form id="tenantForm" novalidate>

        <div class="border rounded p-3 mb-3 bg-light">
          <h6 class="text-dark fw-bold mb-3">
            <i class="fas fa-info-circle me-1"></i> Tenant Details
          </h6>
          <div class="mb-3">
            <label class="form-label small text-muted" for="inputTenantName">Tenant Name <span class="text-danger">*</span></label>
            <input class="form-control" id="inputTenantName" type="text"
                   placeholder="Enter tenant name" required minlength="1" maxlength="255">
          </div>
          <div class="mb-0">
            <label class="form-label small text-muted" for="inputTenantDescription">Description</label>
            <textarea class="form-control" id="inputTenantDescription" rows="3"
                      maxlength="500" placeholder="Optional description"></textarea>
          </div>
        </div>

      </form>
    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i>Cancel
      </button>
      <button class="btn btn-dark" type="button" data-action="tenants.save">
        <i class="fas fa-save me-1"></i>Save
      </button>
    </div>

  </div>
</div>
