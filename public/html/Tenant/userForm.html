<!-- Tenant User form modal -->
<div class="modal-dialog modal-dialog-scrollable modal-xl" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-primary text-white">
      <h5 class="modal-title" id="tenantModalTitle">
        <i class="fas fa-user-plus me-2"></i><span>Add User to Tenant</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">
      <form id="tenantUserForm" novalidate>
        <div class="row">

          <!-- LEFT: Identity & Security -->
          <div class="col-md-7">
            <div class="border rounded p-3 mb-4 bg-light">
              <h6 class="text-primary fw-bold mb-3">
                <i class="fas fa-id-card me-1"></i> Identity
              </h6>

              <!-- Lookup Fields -->
              <div class="row g-3 mb-3" id="tenantLookupFields">
                <div class="col-md-6">
                  <label class="form-label small text-muted" for="tenantInputEmail">Email <span class="text-danger">*</span></label>
                  <input class="form-control" id="tenantInputEmail" type="email" placeholder="Enter email address">
                </div>
                <div class="col-md-6">
                  <label class="form-label small text-muted" for="tenantInputUsername">Username <span class="text-danger">*</span></label>
                  <input class="form-control" id="tenantInputUsername" type="text" placeholder="Enter username">
                </div>
                <div class="col-12">
                  <div class="form-text" id="tenantLookupFeedback"></div>
                </div>
              </div>

              <!-- Name -->
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label small text-muted" for="tenantInputFirstName">First Name <span class="text-danger">*</span></label>
                  <input class="form-control" id="tenantInputFirstName" type="text" placeholder="Enter first name">
                </div>
                <div class="col-md-6">
                  <label class="form-label small text-muted" for="tenantInputLastName">Last Name <span class="text-danger">*</span></label>
                  <input class="form-control" id="tenantInputLastName" type="text" placeholder="Enter last name">
                </div>
              </div>
            </div>

            <!-- Password Section -->
            <div class="border rounded p-3 mb-4" id="tenantPasswordSection">
              <h6 class="text-primary fw-bold mb-3">
                <i class="fas fa-key me-1"></i> Password
              </h6>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label small text-muted" for="tenantInputPassword">Password <span class="text-danger">*</span></label>
                  <input class="form-control" id="tenantInputPassword" type="password" placeholder="Enter password">
                </div>
                <div class="col-md-6">
                  <label class="form-label small text-muted" for="tenantInputConfirmPass">Confirm <span class="text-danger">*</span></label>
                  <input class="form-control" id="tenantInputConfirmPass" type="password" placeholder="Confirm password">
                </div>
              </div>
            </div>
          </div>

          <!-- RIGHT: Business Assignments -->
          <div class="col-md-5">

            <!-- Tenant Owner shortcut -->
            <div class="border rounded p-3 mb-4">
              <div class="form-check form-switch">
                <input class="form-check-input" id="tenantOwnerCheck" type="checkbox">
                <label class="form-check-label fw-semibold" for="tenantOwnerCheck">
                  <i class="fas fa-user-shield me-1 text-warning"></i> Make Tenant Owner
                </label>
              </div>
              <small class="form-text text-muted d-block mt-1">Tenant Owners manage all businesses directly. Business assignments are optional.</small>
            </div>

            <!-- Tenant Owner Alert (hidden by default) -->
            <div id="tenantOwnerAlert" class="alert alert-info py-2 d-none" role="alert">
              <i class="fas fa-info-circle me-1"></i>
              This user is already a tenant owner.
            </div>

            <!-- Business Assignments Section -->
            <div class="border rounded p-3 mb-4" id="businessAccessSection">
              <h6 class="text-primary fw-bold mb-3">
                <i class="fas fa-briefcase me-1"></i> Business Assignments
              </h6>

              <!-- Assignment builder row -->
              <div class="row g-2 mb-3 align-items-end">
                <div class="col-5">
                  <label class="form-label small text-muted" for="tenantBusinessSelect">Business</label>
                  <select class="form-select form-select-sm" id="tenantBusinessSelect">
                    <option value="">— Select —</option>
                  </select>
                </div>
                <div class="col-5">
                  <label class="form-label small text-muted" for="tenantRoleSelect">Role</label>
                  <select class="form-select form-select-sm" id="tenantRoleSelect" disabled>
                    <option value="">— Select business first —</option>
                  </select>
                </div>
                <div class="col-2">
                  <button class="btn btn-primary btn-sm w-100" type="button" id="addAssignmentBtn" title="Add assignment" disabled>
                    <i class="fas fa-plus"></i>
                  </button>
                </div>
              </div>

              <!-- Assignments list -->
              <div id="assignmentsList">
                <p class="text-muted small mb-0" id="noAssignmentsMsg">No business assignments yet.</p>
              </div>
            </div>

          </div>

        </div>
      </form>
    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i><span>Cancel</span>
      </button>
      <button class="btn btn-primary" type="button" id="tenantUserSaveBtn" data-action="tenant.users.save">
        <i class="fas fa-save me-1"></i><span>Save</span>
      </button>
    </div>

  </div>
</div>
