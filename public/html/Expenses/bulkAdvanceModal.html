<!-- Bulk Advance Payment Modal -->
<div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-info text-white">
      <h5 class="modal-title" id="bulkAdvanceModalTitle">
        <i class="fas fa-forward me-2"></i>Pay Multiple Periods in Advance
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">

      <!-- Configuration -->
      <div id="bulkAdvanceConfig">
        <div class="border rounded p-3 mb-4 bg-light">
          <h6 class="text-info fw-bold mb-3">
            <i class="fas fa-calendar-alt me-1"></i> Schedule & Periods
          </h6>
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label small text-muted" for="inputBulkSchedule">Recurring Schedule <span class="text-danger">*</span></label>
              <select class="form-select" id="inputBulkSchedule" required>
                <option value="">— Select a schedule —</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted" for="inputBulkPeriods">Periods <span class="text-danger">*</span></label>
              <input class="form-control" id="inputBulkPeriods" type="number" min="2" max="12" step="1" value="2" required>
              <small class="form-text text-muted">2–12 periods</small>
            </div>
          </div>
        </div>

        <div class="border rounded p-3 mb-4">
          <h6 class="text-info fw-bold mb-3">
            <i class="fas fa-university me-1"></i> Payment Source
          </h6>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputBulkAccount">Account <span class="text-danger">*</span></label>
              <select class="form-select" id="inputBulkAccount" required>
                <option value="">— Select account —</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputBulkPaymentMethod">Method <span class="text-danger">*</span></label>
              <select class="form-select" id="inputBulkPaymentMethod" required>
                <option value="">— Select —</option>
                <option value="CASH">Cash</option>
                <option value="BANK">Bank Transfer</option>
                <option value="CHECK">Check</option>
                <option value="TRANSFER">Transfer</option>
              </select>
            </div>
          </div>
        </div>

        <div class="d-grid">
          <button class="btn btn-outline-info" type="button" data-action="bulk-advance.calculate">
            <i class="fas fa-calculator me-1"></i> Calculate Summary
          </button>
        </div>
      </div>

      <!-- Summary (hidden initially) -->
      <div id="bulkAdvanceSummary" class="d-none mt-4">
        <div class="border rounded p-3 bg-light">
          <h6 class="text-info fw-bold mb-3">
            <i class="fas fa-receipt me-1"></i> Payment Summary
          </h6>
          <table class="table table-sm table-borderless mb-0">
            <tbody>
              <tr><td class="text-muted">Schedule:</td><td class="fw-bold" id="summaryScheduleName">—</td></tr>
              <tr><td class="text-muted">Periods:</td><td class="fw-bold" id="summaryPeriods">—</td></tr>
              <tr><td class="text-muted">Per Period:</td><td class="fw-bold" id="summaryPerPeriod">—</td></tr>
              <tr><td class="text-muted">Total Amount:</td><td class="fw-bold text-success fs-5" id="summaryTotal">—</td></tr>
              <tr><td class="text-muted">Date Range:</td><td class="fw-bold" id="summaryDateRange">—</td></tr>
              <tr><td class="text-muted">Account:</td><td class="fw-bold" id="summaryAccount">—</td></tr>
              <tr><td class="text-muted">Method:</td><td class="fw-bold" id="summaryMethod">—</td></tr>
            </tbody>
          </table>
        </div>
        <div class="alert alert-info mt-3 mb-0">
          <i class="fas fa-info-circle me-1"></i>
          <span id="summaryNote">This creates a single payment and marks all covered periods as paid.</span>
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i>Cancel
      </button>
      <button class="btn btn-info text-white d-none" type="button" data-action="bulk-advance.confirm" id="btnConfirmBulkAdvance">
        <i class="fas fa-check me-1"></i> Confirm Payment
      </button>
    </div>

  </div>
</div>
