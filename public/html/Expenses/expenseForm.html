<!-- Expense form modal -->
<div class="modal-dialog modal-lg modal-dialog-scrollable" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-danger text-white">
      <h5 class="modal-title" id="expenseModalTitle">
        <i class="fas fa-receipt me-2"></i><span data-i18n="expenses.form_title">Expense Details</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">
      <form id="expenseForm" novalidate>

        <!-- Payee & Category Section -->
        <div class="border rounded p-3 mb-4 bg-light">
          <h6 class="text-danger fw-bold mb-3">
            <i class="fas fa-user me-1"></i> <span data-i18n="expenses.payee_category">Payee & Category</span>
          </h6>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputExpensePayee" data-i18n="common.payee">Payee</label>
              <div class="input-group">
                <select class="form-select" id="inputExpensePayee">
                  <option value="" data-i18n="expenses.select_payee">— Select payee —</option>
                </select>
                <button class="btn btn-outline-secondary" type="button" data-action="expenses.create-payee" title="New Payee">
                  <i class="fas fa-plus"></i>
                </button>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputExpenseCategory" data-i18n="common.category">Category</label>
              <select class="form-select" id="inputExpenseCategory">
                <option value="" data-i18n="expenses.select_category">— Select category —</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Amount Section -->
        <div class="border rounded p-3 mb-4">
          <h6 class="text-danger fw-bold mb-3">
            <i class="fas fa-calculator me-1"></i> <span data-i18n="common.amount">Amount</span>
          </h6>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label small text-muted" for="inputExpenseDate"><span data-i18n="expenses.expense_date">Expense Date</span> <span class="text-danger">*</span></label>
              <input class="form-control" id="inputExpenseDate" type="date" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted" for="inputExpenseCurrency"><span data-i18n="common.currency">Currency</span> <span class="text-danger">*</span></label>
              <select class="form-select" id="inputExpenseCurrency" required>
                <option value="" data-i18n="common.select_currency">Select a currency</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="LBP">LBP</option>
                <option value="AED">AED</option>
                <option value="SAR">SAR</option>
                <option value="EGP">EGP</option>
                <option value="JOD">JOD</option>
                <option value="KWD">KWD</option>
                <option value="TRY">TRY</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted" for="inputExpenseExchangeRate"><span data-i18n="common.exchange_rate">Exchange Rate</span> <span class="text-danger">*</span></label>
              <input class="form-control" id="inputExpenseExchangeRate" type="number"
                     step="0.000000000001" min="0" placeholder="1" required>
            </div>
          </div>
          <div class="row g-3 mt-1">
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputExpenseAmountFc"><span data-i18n="common.amount_fc">Amount (FC)</span> <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-coins"></i></span>
                <input class="form-control" id="inputExpenseAmountFc" type="number"
                       step="0.01" min="0" placeholder="0.00" required>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputExpenseAmountBc" data-i18n="common.amount_bc">Amount (BC)</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-equals"></i></span>
                <input class="form-control bg-light" id="inputExpenseAmountBc" type="text"
                       readonly data-i18n-placeholder="common.auto_calculated" placeholder="Auto-calculated" tabindex="-1">
              </div>
            </div>
          </div>
        </div>

        <!-- Document Reference Section -->
        <div class="border rounded p-3 mb-4">
          <h6 class="text-danger fw-bold mb-3">
            <i class="fas fa-file-alt me-1"></i> <span data-i18n="expenses.document_reference">Document Reference</span>
          </h6>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputExpenseReferenceNumber" data-i18n="expenses.vendor_invoice_number">Vendor Invoice #</label>
              <input class="form-control" id="inputExpenseReferenceNumber" type="text"
                     maxlength="100" placeholder="e.g. INV-2024-001">
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputExpenseReferenceDate" data-i18n="expenses.invoice_date">Invoice Date</label>
              <input class="form-control" id="inputExpenseReferenceDate" type="date">
            </div>
          </div>
          <div class="row g-3 mt-1">
            <div class="col-12">
              <label class="form-label small text-muted" for="inputExpenseAttachment" data-i18n="expenses.attach_document">Attach Document</label>
              <div class="input-group">
                <input class="form-control" id="inputExpenseAttachment" type="file"
                       accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
                <span class="input-group-text" id="attachmentStatus"><i class="fas fa-paperclip"></i></span>
              </div>
              <small class="form-text text-muted" id="currentAttachment"></small>
            </div>
          </div>
        </div>

        <!-- Notes -->
        <div class="mb-3">
          <label class="form-label small text-muted" for="inputExpenseNotes">
            <i class="fas fa-sticky-note me-1"></i> <span data-i18n="common.notes">Notes</span>
          </label>
          <textarea class="form-control" id="inputExpenseNotes" rows="2"
                    data-i18n-placeholder="common.optional_notes" placeholder="Optional notes"></textarea>
        </div>

        <!-- Recurrence Configuration (per-expense, like salaries) -->
        <div id="expenseRecurrenceSection">
          <div class="border rounded p-3 mb-3">
            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" id="inputExpenseRecurrenceToggle">
              <label class="form-check-label fw-bold" for="inputExpenseRecurrenceToggle">
                <i class="fas fa-redo me-1 text-danger"></i>
                <span data-i18n="expenses.configure_recurrence">Make this a Recurring Expense</span>
              </label>
            </div>

            <div id="expenseRecurrenceFields" style="display:none;">
              <div class="card border-left-danger mb-0">
                <div class="card-body py-3">
                  <div class="row g-3">
                    <div class="col-md-4">
                      <label class="form-label small text-muted" for="inputExpRecurrenceFrequency"><span data-i18n="recurring.frequency">Frequency</span> <span class="text-danger">*</span></label>
                      <select class="form-select" id="inputExpRecurrenceFrequency" required>
                        <option value="" data-i18n="recurring.select_frequency">— Select —</option>
                        <option value="weekly">Weekly</option>
                        <option value="bi-weekly">Bi-Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="quarterly">Quarterly</option>
                        <option value="yearly">Yearly</option>
                      </select>
                    </div>
                    <div class="col-md-4">
                      <label class="form-label small text-muted" for="inputExpRecurrenceStartDate"><span data-i18n="recurring.start_date">Start Date</span> <span class="text-danger">*</span></label>
                      <input class="form-control" id="inputExpRecurrenceStartDate" type="date" required>
                    </div>
                    <div class="col-md-4">
                      <label class="form-label small text-muted" for="inputExpRecurrenceEndDate" data-i18n="recurring.end_date">End Date</label>
                      <input class="form-control" id="inputExpRecurrenceEndDate" type="date">
                    </div>
                  </div>
                  <p class="text-muted small mt-2 mb-0">
                    <i class="fas fa-info-circle me-1"></i>
                    This will generate recurring instances for this specific expense (payee + category + amount).
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>

      </form>
    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i><span data-i18n="common.cancel">Cancel</span>
      </button>
      <button class="btn btn-danger" type="button" data-action="expenses.save">
        <i class="fas fa-save me-1"></i><span data-i18n="common.save">Save Expense</span>
      </button>
    </div>

  </div>
</div>
