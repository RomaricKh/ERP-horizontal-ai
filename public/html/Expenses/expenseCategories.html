<!-- Expense Categories management modal -->
<div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-danger text-white">
      <h5 class="modal-title">
        <i class="fas fa-folder me-2"></i><span data-i18n="expenses.manage_categories">Manage Expense Categories</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">

      <!-- Add new category -->
      <div class="border rounded p-3 mb-4 bg-light">
        <h6 class="text-danger fw-bold mb-3">
          <i class="fas fa-plus-circle me-1"></i> Add New Category
        </h6>
        <div class="input-group mb-2">
          <input class="form-control" id="newExpenseCategoryName" type="text"
                 data-i18n-placeholder="expenses.category_name_placeholder" placeholder="New category name (e.g. Rent, Utilities, Office Supplies…)">
          <button class="btn btn-danger" type="button" data-action="expense-categories.add">
            <i class="fas fa-plus me-1"></i><span data-i18n="common.add">Add</span>
          </button>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="newExpenseCategoryIsFixed">
          <label class="form-check-label" for="newExpenseCategoryIsFixed">
            <i class="fas fa-sync-alt me-1 text-secondary"></i> Fixed / Recurring Expense
          </label>
        </div>

        <!-- Recurrence fields (shown when is_fixed is checked) -->
        <div id="newCategoryRecurrenceFields" class="mt-3 border-top pt-3" style="display:none;">
          <div class="row g-2">
            <div class="col-md-4">
              <label class="form-label small text-muted" for="newRecurrenceFrequency">Frequency <span class="text-danger">*</span></label>
              <select class="form-select form-select-sm" id="newRecurrenceFrequency">
                <option value="">Select frequency</option>
                <option value="weekly">Weekly</option>
                <option value="bi-weekly">Bi-Weekly</option>
                <option value="monthly">Monthly</option>
                <option value="quarterly">Quarterly</option>
                <option value="yearly">Yearly</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted" for="newRecurrenceAmount">Default Amount <span class="text-danger">*</span></label>
              <input class="form-control form-control-sm" type="number" step="0.01" min="0" id="newRecurrenceAmount" placeholder="0.00">
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted" for="newRecurrenceCurrency">Currency <span class="text-danger">*</span></label>
              <select class="form-select form-select-sm" id="newRecurrenceCurrency">
                <option value="">Select currency</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="LBP">LBP</option>
                <option value="AED">AED</option>
                <option value="SAR">SAR</option>
                <option value="EGP">EGP</option>
                <option value="JOD">JOD</option>
                <option value="KWD">KWD</option>
                <option value="TRY">TRY</option>
              </select>
            </div>
          </div>
          <div class="row g-2 mt-1">
            <div class="col-md-6">
              <label class="form-label small text-muted" for="newRecurrenceStartDate">Start Date</label>
              <input class="form-control form-control-sm" type="date" id="newRecurrenceStartDate">
              <small class="text-muted">Defaults to today if empty</small>
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted" for="newRecurrenceEndDate">End Date <span class="text-muted">(optional)</span></label>
              <input class="form-control form-control-sm" type="date" id="newRecurrenceEndDate">
            </div>
          </div>
          <div id="newRecurrenceDateError" class="text-danger small mt-1" style="display:none;">
            End date must be on or after start date.
          </div>
        </div>
      </div>

      <!-- Existing categories list -->
      <div id="expenseCategoriesList">
        <div class="text-center text-muted py-3" data-i18n="common.loading">Loading…</div>
      </div>

      <!-- Recurrence configuration panel (shown when configuring an existing category) -->
      <div id="recurrenceConfigPanel" class="border rounded p-3 mt-3 bg-light" style="display:none;">
        <h6 class="text-primary fw-bold mb-3">
          <i class="fas fa-sync-alt me-1"></i> Configure Recurrence — <span id="recurrenceConfigCategoryName"></span>
        </h6>
        <input type="hidden" id="recurrenceConfigCategoryId">
        <div class="row g-2">
          <div class="col-md-4">
            <label class="form-label small text-muted" for="editRecurrenceFrequency">Frequency <span class="text-danger">*</span></label>
            <select class="form-select form-select-sm" id="editRecurrenceFrequency">
              <option value="">Select frequency</option>
              <option value="weekly">Weekly</option>
              <option value="bi-weekly">Bi-Weekly</option>
              <option value="monthly">Monthly</option>
              <option value="quarterly">Quarterly</option>
              <option value="yearly">Yearly</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small text-muted" for="editRecurrenceAmount">Default Amount <span class="text-danger">*</span></label>
            <input class="form-control form-control-sm" type="number" step="0.01" min="0" id="editRecurrenceAmount" placeholder="0.00">
          </div>
          <div class="col-md-4">
            <label class="form-label small text-muted" for="editRecurrenceCurrency">Currency <span class="text-danger">*</span></label>
            <select class="form-select form-select-sm" id="editRecurrenceCurrency">
              <option value="">Select currency</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="GBP">GBP</option>
              <option value="LBP">LBP</option>
              <option value="AED">AED</option>
              <option value="SAR">SAR</option>
              <option value="EGP">EGP</option>
              <option value="JOD">JOD</option>
              <option value="KWD">KWD</option>
              <option value="TRY">TRY</option>
            </select>
          </div>
        </div>
        <div class="row g-2 mt-1">
          <div class="col-md-6">
            <label class="form-label small text-muted" for="editRecurrenceStartDate">Start Date</label>
            <input class="form-control form-control-sm" type="date" id="editRecurrenceStartDate">
            <small class="text-muted">Defaults to today if empty</small>
          </div>
          <div class="col-md-6">
            <label class="form-label small text-muted" for="editRecurrenceEndDate">End Date <span class="text-muted">(optional)</span></label>
            <input class="form-control form-control-sm" type="date" id="editRecurrenceEndDate">
          </div>
        </div>
        <div id="editRecurrenceDateError" class="text-danger small mt-1" style="display:none;">
          End date must be on or after start date.
        </div>
        <div class="mt-3 d-flex gap-2">
          <button class="btn btn-sm btn-primary" type="button" data-action="expense-categories.save-recurrence">
            <i class="fas fa-save me-1"></i> Save Recurrence
          </button>
          <button class="btn btn-sm btn-outline-secondary" type="button" data-action="expense-categories.cancel-recurrence">
            Cancel
          </button>
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i><span data-i18n="common.close">Close</span>
      </button>
    </div>

  </div>
</div>
