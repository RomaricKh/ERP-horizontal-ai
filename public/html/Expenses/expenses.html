<!-- Page Heading -->
<h1 class="h3 mb-2 text-gray-800" data-i18n="expenses.title">Expenses</h1>

<!-- Expenses DataTable -->
<div class="card shadow mb-4">
    <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
        <h6 class="m-0 font-weight-bold text-primary" data-i18n="expenses.heading">Expenses</h6>
        <div class="d-flex gap-2">
            <button class="btn btn-secondary btn-icon-split btn-sm"
                    data-action="expenses.manage-categories" title="Manage expense categories">
                <span class="text" data-i18n="expenses.categories_btn">Categories</span>
                <span class="icon"><i class="fas fa-fw fa-tags"></i></span>
            </button>
            <button class="btn btn-primary btn-icon-split btn-sm"
                    data-action="expenses.create" title="Add a new expense">
                <span class="text" data-i18n="expenses.add_btn">Add Expense</span>
                <span class="icon"><i class="fas fa-fw fa-plus"></i></span>
            </button>
        </div>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover row-border"
                   id="expensesTable" width="100%" cellspacing="0">
                <thead>
                    <tr>
                        <th data-i18n="common.id">ID</th>
                        <th data-i18n="common.date">Date</th>
                        <th data-i18n="common.payee">Payee</th>
                        <th data-i18n="common.category">Category</th>
                        <th data-i18n="expenses.reference">Ref #</th>
                        <th data-i18n="common.currency">Currency</th>
                        <th data-i18n="common.amount_fc">Amount</th>
                        <th data-i18n="common.status">Status</th>
                        <th title="Document attached"><i class="fas fa-paperclip"></i></th>
                        <th data-i18n="common.actions">Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>
