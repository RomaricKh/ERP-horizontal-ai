<!-- Page Heading -->
<h1 class="h3 mb-2 text-gray-800">Users</h1>

<!-- DataTales Example -->
<div class="card shadow mb-4">
	<div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
		<h6 class="m-0 font-weight-bold text-primary">ERP Users</h6>
		<button class="btn btn-primary btn-icon-split btn-sm" data-action="users.create" data-bs-toggle="tooltip" data-bs-placement="top" title="Create a new user">
			<span class="text">Create</span>
			<span class="icon"><i class="fas fa-fw fa-user-plus"></i></span>
		</button>
	</div>
	<div class="card-body">
		<div class="table-responsive">
			<table class="table table-bordered table-striped table-hover row-border" id="dataTable" width="100%" cellspacing="0">
				<thead>
					<tr>
						<th>User id</th>
						<th>Username</th>
						<th>Name</th>
						<th>Email</th>
						<th>Role</th>
						<th>Business</th>
						<th>Is active</th>
						<th>Actions</th>
					</tr>
				</thead>
				<tbody></tbody>
			</table>
		</div>
	</div>
</div>
