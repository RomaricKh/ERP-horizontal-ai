<!-- Account details modal -->
<div class="modal-dialog modal-dialog-scrollable modal-xl" role="document">
  <div class="modal-content text-gray-800">

    <!-- HEADER -->
    <div class="modal-header">
      <h5 class="modal-title" id="modalTitle">Account Details</h5>
      <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <!-- BODY -->
    <div class="modal-body">
      <form>

        <div class="row">

          <!-- ========================= -->
          <!-- LEFT COLUMN: IDENTITY -->
          <!-- ========================= -->
          <div class="col-md-7">

            <h6 class="text-muted mb-3">Identity &amp; Security</h6>

            <!-- Modify Identity -->
            <div class="mb-3">
              <button
                class="btn btn-outline-primary"
                type="button"
                data-action="users.modify.identity"
                id="modifyIdentity"
                title="Modify Identity">
                Modify Identity
              </button>
            </div>

            <!-- Lookup Fields -->
            <div class="row gx-3 mb-3" id="lookupFields">
              <div class="col-md-6">
                <label class="mb-1" for="inputEmailAddress">Email address</label>
                <input
                  class="form-control"
                  id="inputEmailAddress"
                  type="email"
                  placeholder="Enter email address">
              </div>

              <div class="col-md-6">
                <label class="mb-1" for="inputUsername">Username</label>
                <input
                  class="form-control"
                  id="inputUsername"
                  type="text"
                  placeholder="Enter username">
              </div>

              <div class="col-12">
                <div class="form-text" id="lookupFeedback"></div>
              </div>
            </div>

            <div class="dropdown-divider"></div>

            <!-- Name -->
            <div class="row gx-3 mb-3">
              <div class="col-md-6">
                <label class="mb-1" for="inputFirstName">First name</label>
                <input
                  class="form-control"
                  id="inputFirstName"
                  type="text"
                  placeholder="Enter first name">
              </div>

              <div class="col-md-6">
                <label class="mb-1" for="inputLastName">Last name</label>
                <input
                  class="form-control"
                  id="inputLastName"
                  type="text"
                  placeholder="Enter last name">
              </div>
            </div>

            <div class="dropdown-divider"></div>

            <!-- Password Reset -->
            <div class="mb-3">
              <button
                class="btn btn-outline-warning"
                type="button"
                data-action="users.password.reset"
                id="passwordReset"
                title="Password Reset">
                Reset Password
              </button>
            </div>

            <!-- Password Fields -->
            <div class="row gx-3 mb-3">
              <div class="col-md-6">
                <label class="mb-1" for="inputPassword">Password</label>
                <input
                  class="form-control"
                  id="inputPassword"
                  type="password"
                  placeholder="Enter password">
              </div>

              <div class="col-md-6">
                <label class="mb-1" for="inputConfirmPass">Confirm Password</label>
                <input
                  class="form-control"
                  id="inputConfirmPass"
                  type="password"
                  placeholder="Confirm password">
              </div>
            </div>

          </div>

          <!-- ========================= -->
          <!-- RIGHT COLUMN: ACCESS -->
          <!-- ========================= -->
          <div class="col-md-5 border-start">

            <h6 class="text-muted mb-3">Business Access</h6>

            <!-- Role -->
            <div class="mb-4">
              <label class="form-label" for="roleSelect">Role</label>
              <select class="form-select" id="roleSelect">
                <option value="" selected>Select a role</option>
                <option value="1">Business_Owner</option>
                <option value="2">ACCOUNTANT</option>
                <!-- populated dynamically -->
              </select>
            </div>

            <!-- Active -->
            <div class="form-check form-check-solid">
              <input
                class="form-check-input"
                id="isActiveCheck"
                type="checkbox">
              <label class="form-check-label" for="isActiveCheck">
                Active on this business
              </label>
            </div>

          </div>

        </div>
      </form>
    </div>

    <!-- FOOTER -->
    <div class="modal-footer">
      <button
        class="btn btn-secondary"
        type="button"
        data-bs-dismiss="modal"
        title="Close">
        Close
      </button>

      <button
        class="btn btn-primary"
        type="button"
        data-action="users.save"
        id="saveBtn"
        title="Save user">
        Save user
      </button>
    </div>

  </div>
</div>
