<!-- Role view modal (read-only) -->
<div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
  <div class="modal-content text-gray-800">

    <!-- HEADER -->
    <div class="modal-header bg-gradient-dark text-white">
      <h5 class="modal-title" id="roleViewTitle">
        <i class="fas fa-user-shield me-2"></i><span data-i18n="roles.view_title">Role Details</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <!-- BODY -->
    <div class="modal-body px-4">

      <!-- Role Info -->
      <div class="border rounded p-3 mb-4 bg-light">
        <h6 class="text-dark fw-bold mb-3">
          <i class="fas fa-info-circle me-1"></i> Role Details
        </h6>
        <div class="row g-3">
          <div class="col-md-5">
            <label class="form-label small text-muted">Role Name</label>
            <div class="form-control-plaintext fw-bold" id="roleViewName">—</div>
          </div>
          <div class="col-md-7">
            <label class="form-label small text-muted" data-i18n="common.description">Description</label>
            <div class="form-control-plaintext text-muted" id="roleViewDescription">No description</div>
          </div>
        </div>
      </div>

      <!-- Permissions -->
      <div class="border rounded p-3 mb-3">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h6 class="text-dark fw-bold mb-0">
            <i class="fas fa-lock me-1"></i> Permissions
          </h6>
          <span class="badge bg-primary" id="roleViewPermCount">0 permissions</span>
        </div>
        <div id="roleViewPermissions" style="max-height: 400px; overflow-y: auto;">
          <span class="text-muted small" data-i18n="common.loading">Loading…</span>
        </div>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i><span data-i18n="common.close">Close</span>
      </button>
      <button class="btn btn-dark" type="button" id="roleViewEditBtn" style="display:none;">
        <i class="fas fa-edit me-1"></i> <span data-i18n="roles.edit_role">Edit Role</span>
      </button>
    </div>

  </div>
</div>
