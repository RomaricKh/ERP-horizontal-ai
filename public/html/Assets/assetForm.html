<!-- Asset form modal -->
<div class="modal-dialog modal-lg modal-dialog-scrollable" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-secondary text-white">
      <h5 class="modal-title" id="assetModalTitle">
        <i class="fas fa-building me-2"></i><span data-i18n="assets.form_title">Asset Details</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">
      <form id="assetForm" novalidate>
        <input type="hidden" id="inputAssetId">

        <!-- Asset Identity Section -->
        <div class="border rounded p-3 mb-4 bg-light">
          <h6 class="text-secondary fw-bold mb-3">
            <i class="fas fa-tag me-1"></i> <span data-i18n="assets.identity_heading">Asset Identity</span>
          </h6>
          <div class="row g-3">
            <div class="col-md-5">
              <label class="form-label small text-muted" for="inputAssetName"><span data-i18n="common.name">Name</span> <span class="text-danger">*</span></label>
              <input class="form-control" id="inputAssetName" type="text"
                     data-i18n-placeholder="assets.name_placeholder" placeholder="Asset name" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted" for="inputAssetCategory"><span data-i18n="common.category">Category</span> <span class="text-danger">*</span></label>
              <select class="form-select" id="inputAssetCategory" required>
                <option value="" data-i18n="assets.select_category">— Select category —</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted" for="inputAssetType"><span data-i18n="common.type">Asset Type</span> <span class="text-danger">*</span></label>
              <select class="form-select" id="inputAssetType" required>
                <option value="" data-i18n="assets.select_type">— Select —</option>
                <option value="FIXED" data-i18n="assets.type_fixed">Fixed</option>
                <option value="CURRENT" data-i18n="assets.type_current">Current</option>
                <option value="INTANGIBLE" data-i18n="assets.type_intangible">Intangible</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Purchase Details Section -->
        <div class="border rounded p-3 mb-4">
          <h6 class="text-secondary fw-bold mb-3">
            <i class="fas fa-shopping-cart me-1"></i> <span data-i18n="assets.purchase_heading">Purchase Details</span>
          </h6>
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label small text-muted" for="inputAssetPurchaseDate"><span data-i18n="assets.purchase_date">Purchase Date</span> <span class="text-danger">*</span></label>
              <input class="form-control" id="inputAssetPurchaseDate" type="date" required>
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted" for="inputAssetPurchaseValue"><span data-i18n="assets.purchase_value">Value</span> <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-coins"></i></span>
                <input class="form-control" id="inputAssetPurchaseValue" type="number"
                       step="0.01" min="0" placeholder="0.00" required>
              </div>
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted" for="inputAssetCurrency"><span data-i18n="common.currency">Currency</span> <span class="text-danger">*</span></label>
              <select class="form-select" id="inputAssetCurrency" required>
                <option value="" data-i18n="common.select_currency">Select</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="LBP">LBP</option>
                <option value="AED">AED</option>
                <option value="SAR">SAR</option>
                <option value="EGP">EGP</option>
                <option value="JOD">JOD</option>
                <option value="KWD">KWD</option>
                <option value="TRY">TRY</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted" for="inputAssetExchangeRate"><span data-i18n="common.exchange_rate">Rate</span> <span class="text-danger">*</span></label>
              <input class="form-control" id="inputAssetExchangeRate" type="number"
                     step="0.000001" min="0" placeholder="1.000000" required>
            </div>
          </div>
        </div>

        <!-- Depreciation Section -->
        <div class="border rounded p-3 mb-4">
          <h6 class="text-secondary fw-bold mb-3">
            <i class="fas fa-chart-line me-1"></i> <span data-i18n="assets.depreciation_heading">Depreciation</span>
          </h6>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputAssetDepreciationMethod"><span data-i18n="assets.depreciation_method">Method</span> <span class="text-danger">*</span></label>
              <select class="form-select" id="inputAssetDepreciationMethod" required>
                <option value="" data-i18n="assets.select_method">— Select method —</option>
                <option value="STRAIGHT_LINE" data-i18n="assets.method_straight_line">Straight Line</option>
                <option value="DECLINING_BALANCE" data-i18n="assets.method_declining_balance">Declining Balance</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted" for="inputAssetUsefulLife"><span data-i18n="assets.useful_life">Useful Life (years)</span> <span class="text-danger">*</span></label>
              <div class="input-group">
                <input class="form-control" id="inputAssetUsefulLife" type="number"
                       step="1" min="1" placeholder="e.g. 5" required>
                <span class="input-group-text">years</span>
              </div>
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted" for="inputAssetSalvageValue"><span data-i18n="assets.salvage_value">Salvage Value</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-coins"></i></span>
                <input class="form-control" id="inputAssetSalvageValue" type="number"
                       step="0.01" min="0" placeholder="0.00">
              </div>
            </div>
          </div>
        </div>

        <!-- Notes -->
        <div class="mb-2">
          <label class="form-label small text-muted" for="inputAssetNotes">
            <i class="fas fa-sticky-note me-1"></i> <span data-i18n="common.notes">Notes</span>
          </label>
          <textarea class="form-control" id="inputAssetNotes" rows="2"
                    data-i18n-placeholder="common.optional_notes" placeholder="Optional notes"></textarea>
        </div>

      </form>
    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i><span data-i18n="common.cancel">Cancel</span>
      </button>
      <button class="btn btn-secondary" type="button" data-action="assets.save">
        <i class="fas fa-save me-1"></i><span data-i18n="common.save">Save Asset</span>
      </button>
    </div>

  </div>
</div>
