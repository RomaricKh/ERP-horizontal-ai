<!-- Page Heading -->
<h1 class="h3 mb-2 text-gray-800"><span data-i18n="assets.page_title">Assets</span></h1>

<!-- DataTable Card -->
<div class="card shadow mb-4">
	<div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
		<h6 class="m-0 font-weight-bold text-primary" data-i18n="assets.manage_heading">Manage Assets</h6>
		<button class="btn btn-primary btn-icon-split btn-sm" data-action="assets.create">
			<span class="text" data-i18n="assets.add_btn">Add Asset</span>
			<span class="icon"><i class="fas fa-fw fa-plus"></i></span>
		</button>
	</div>
	<div class="card-body">
		<div class="table-responsive">
			<table class="table table-bordered table-striped table-hover row-border"
				   id="assetsTable" width="100%" cellspacing="0">
				<thead>
					<tr>
						<th>ID</th>
						<th data-i18n="common.name">Name</th>
						<th data-i18n="common.category">Category</th>
						<th data-i18n="common.type">Type</th>
						<th data-i18n="assets.purchase_date">Purchase Date</th>
						<th data-i18n="assets.purchase_value">Purchase Value</th>
						<th data-i18n="assets.current_value">Current Value</th>
						<th class="text-center" data-i18n="common.actions">Actions</th>
					</tr>
				</thead>
				<tbody></tbody>
			</table>
		</div>
	</div>
</div>
