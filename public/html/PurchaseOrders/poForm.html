<!-- PO Form Modal -->
<div class="modal-dialog modal-xl modal-dialog-scrollable" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-warning">
      <h5 class="modal-title" id="poModalTitle">
        <i class="fas fa-shopping-cart me-2"></i><span data-i18n="po.form_title">New Purchase Order</span>
      </h5>
      <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">

      <!-- Header Section -->
      <div class="border rounded p-3 mb-4 bg-light">
        <h6 class="text-warning fw-bold mb-3">
          <i class="fas fa-info-circle me-1"></i> <span data-i18n="po.details_heading">Order Details</span>
        </h6>
        <form id="poHeaderForm" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputPoSupplier" data-i18n="po.supplier">Supplier</label>
              <div class="input-group">
                <select class="form-select" id="inputPoSupplier">
                  <option value="" data-i18n="po.select_supplier">— Select supplier —</option>
                </select>
                <button class="btn btn-outline-secondary" type="button" data-action="po.create-supplier" title="New Supplier">
                  <i class="fas fa-plus"></i>
                </button>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputPoNumber"><span data-i18n="po.po_number">PO #</span></label>
              <input class="form-control" id="inputPoNumber" type="text" data-i18n-placeholder="po.po_number_placeholder" placeholder="Auto-generated on save" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted" for="inputPoDate"><span data-i18n="po.po_date">PO Date</span> <span class="text-danger">*</span></label>
              <input class="form-control" id="inputPoDate" type="date" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted" for="inputPoCurrency"><span data-i18n="common.currency">Currency</span> <span class="text-danger">*</span></label>
              <select class="form-select" id="inputPoCurrency" required>
                <option value="">Select</option>
                <option value="USD">USD</option><option value="EUR">EUR</option><option value="GBP">GBP</option>
                <option value="LBP">LBP</option><option value="AED">AED</option><option value="SAR">SAR</option>
                <option value="EGP">EGP</option><option value="JOD">JOD</option><option value="KWD">KWD</option><option value="TRY">TRY</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted" for="inputPoExchangeRate"><span data-i18n="common.exchange_rate">Rate</span> <span class="text-danger">*</span></label>
              <input class="form-control" id="inputPoExchangeRate" type="number" step="0.000001" min="0" placeholder="1.000000" required>
            </div>
            <div class="col-12">
              <label class="form-label small text-muted" for="inputPoNotes" data-i18n="common.notes">Notes</label>
              <textarea class="form-control" id="inputPoNotes" rows="2" data-i18n-placeholder="common.optional_notes" placeholder="Optional notes"></textarea>
            </div>
          </div>
        </form>
      </div>

      <!-- Line Items Section -->
      <div class="border rounded p-3 mb-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h6 class="text-warning fw-bold mb-0">
            <i class="fas fa-list me-1"></i> <span data-i18n="po.line_items">Line Items</span>
          </h6>
          <button class="btn btn-outline-warning btn-sm" type="button" data-action="po.add-line">
            <i class="fas fa-plus me-1"></i><span data-i18n="po.add_line">Add Line</span>
          </button>
        </div>
        <div class="table-responsive">
          <table class="table table-bordered table-sm mb-0" id="poLinesTable">
            <thead class="table-light">
              <tr>
                <th style="min-width:180px">Item</th>
                <th style="min-width:90px">Qty</th>
                <th style="min-width:110px">Price (FC)</th>
                <th style="min-width:110px">Price (BC)</th>
                <th style="min-width:80px">Tax %</th>
                <th style="min-width:80px">Disc %</th>
                <th style="min-width:110px">Total (FC)</th>
                <th style="width:75px"></th>
              </tr>
            </thead>
            <tbody id="poLinesBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Supplier Prices Panel -->
      <div id="poSupplierPricesSection" class="d-none mb-3">
        <div class="card border-info">
          <div class="card-header py-2 d-flex align-items-center justify-content-between bg-light">
            <h6 class="m-0 text-info"><i class="fas fa-truck me-1"></i>Supplier Prices: <span id="poSupplierPricesItemName">—</span></h6>
            <button type="button" class="btn-close btn-sm" data-action="po.close-supplier-prices" aria-label="Close"></button>
          </div>
          <div class="card-body p-0" id="poSupplierPricesContainer"></div>
        </div>
      </div>

      <!-- Totals -->
      <div class="d-flex justify-content-end">
        <div class="border rounded p-3 bg-light" style="min-width:300px;">
          <div class="d-flex justify-content-between mb-1"><span class="text-muted small">Subtotal (FC)</span><span class="fw-semibold" id="poSubtotalFc">0.00</span></div>
          <div class="d-flex justify-content-between mb-1 align-items-center">
            <span class="text-muted small">Global Discount %</span>
            <input type="number" class="form-control form-control-sm" id="inputPoGlobalDiscount" style="width:80px;" step="0.01" min="0" max="100" value="0" placeholder="0">
          </div>
          <div class="d-flex justify-content-between mb-1"><span class="text-muted small">After Discount (FC)</span><span class="fw-semibold" id="poAfterDiscountFc">0.00</span></div>
          <div class="d-flex justify-content-between mb-1"><span class="text-muted small">Tax (FC)</span><span class="fw-semibold" id="poTaxTotalFc">0.00</span></div>
          <hr class="my-1">
          <div class="d-flex justify-content-between mb-2"><span class="fw-bold">Grand Total (FC)</span><span class="fs-5 fw-bold text-warning" id="poGrandTotalFc">0.00</span></div>
          <div class="d-flex justify-content-between mb-1"><span class="text-muted small">Subtotal (BC)</span><span class="fw-semibold" id="poSubtotalBc">0.00</span></div>
          <div class="d-flex justify-content-between mb-1"><span class="text-muted small">Tax (BC)</span><span class="fw-semibold" id="poTaxTotalBc">0.00</span></div>
          <hr class="my-1">
          <div class="d-flex justify-content-between"><span class="fw-bold">Grand Total (BC)</span><span class="fs-6 fw-bold text-secondary" id="poGrandTotalBc">0.00</span></div>
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal"><i class="fas fa-times me-1"></i><span data-i18n="common.close">Close</span></button>
      <button class="btn btn-warning" type="button" data-action="po.save"><i class="fas fa-save me-1"></i><span data-i18n="po.save_btn">Save PO</span></button>
    </div>

  </div>
</div>
