<!-- Debit Note View Modal -->
<div class="modal-dialog modal-lg modal-dialog-scrollable" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-warning text-white">
      <h5 class="modal-title" id="dnViewModalTitle">
        <i class="fas fa-undo me-2"></i><span>Debit Note Details</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">

      <!-- Header Info -->
      <div class="border rounded p-3 mb-4 bg-light">
        <div class="row g-3">
          <div class="col-md-3">
            <small class="text-muted d-block">Debit Note #</small>
            <strong id="dnViewNumber">—</strong>
          </div>
          <div class="col-md-3">
            <small class="text-muted d-block">Status</small>
            <span id="dnViewStatus">—</span>
          </div>
          <div class="col-md-3">
            <small class="text-muted d-block">Date</small>
            <strong id="dnViewDate">—</strong>
          </div>
          <div class="col-md-3">
            <small class="text-muted d-block">PO #</small>
            <strong id="dnViewPO">—</strong>
          </div>
        </div>
        <div class="row g-3 mt-2">
          <div class="col-md-6">
            <small class="text-muted d-block">Notes</small>
            <span id="dnViewNotes" class="text-secondary">—</span>
          </div>
          <div class="col-md-3">
            <small class="text-muted d-block">Currency</small>
            <strong id="dnViewCurrency">—</strong>
          </div>
          <div class="col-md-3">
            <small class="text-muted d-block">Total (BC)</small>
            <strong id="dnViewTotal" class="text-warning fs-5">—</strong>
          </div>
        </div>
      </div>

      <!-- Line Items -->
      <div class="border rounded p-3">
        <h6 class="text-warning fw-bold mb-3"><i class="fas fa-list me-1"></i> Return Items</h6>
        <div class="table-responsive">
          <table class="table table-bordered table-sm mb-0">
            <thead class="table-light">
              <tr>
                <th>Item</th>
                <th class="text-end">Qty</th>
                <th class="text-end">Unit Price (FC)</th>
                <th class="text-end">Unit Price (BC)</th>
                <th class="text-end">Total (BC)</th>
              </tr>
            </thead>
            <tbody id="dnViewLinesBody"></tbody>
          </table>
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i>Close
      </button>
    </div>

  </div>
</div>
