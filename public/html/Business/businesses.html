<!-- Page Heading -->
<h1 class="h3 mb-2 text-gray-800">Businesses</h1>

<!-- DataTales Example -->
<div class="card shadow mb-4">
	<div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
		<h6 class="m-0 font-weight-bold text-primary">Your businesses</h6>
		<button class="btn btn-primary btn-icon-split btn-sm" data-action="businesses.create" data-bs-toggle="tooltip" data-bs-placement="top" title="Create a new business">
			<span class="text">Create</span>
			<span class="icon"><i class="fas fa-fw fa-user-plus"></i></span>
		</button>
	</div>
	<div class="card-body">
		<div class="table-responsive">
			<table class="table table-bordered table-striped table-hover row-border" id="dataTable" width="100%" cellspacing="0">
				<thead>
					<tr>
						<th>Business id</th>
						<th>Name</th>
						<th>Legal Name</th>
						<th>Registration Nº</th>
						<th>Address</th>
						<th>Phone</th>
						<th>Email</th>
						<th>Currency</th>
						<th>Actions</th>
					</tr>
				</thead>
				<tbody></tbody>
			</table>
		</div>
	</div>
</div>
