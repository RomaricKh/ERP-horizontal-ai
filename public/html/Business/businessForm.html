<!-- Business form modal -->
<div class="modal-dialog modal-dialog-scrollable modal-xl" role="document">
  <div class="modal-content text-gray-800">

    <!-- HEADER -->
    <div class="modal-header">
      <h5 class="modal-title" id="businessModalTitle" data-i18n="businesses.form_title">Business Details</h5>
      <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <!-- BODY -->
    <div class="modal-body">
      <form id="businessForm" novalidate>

        <div class="row">

          <!-- ========================= -->
          <!-- LEFT COLUMN -->
          <!-- ========================= -->
          <div class="col-md-7">

            <h6 class="text-muted mb-3" data-i18n="businesses.info_heading">Business Information</h6>

            <!-- Name (required) -->
            <div class="mb-3">
              <label class="form-label" for="inputBusinessName"><span data-i18n="businesses.business_name">Business Name</span> <span class="text-danger">*</span></label>
              <input
                class="form-control"
                id="inputBusinessName"
                type="text"
                data-i18n-placeholder="businesses.name_placeholder"
                placeholder="Enter business name"
                required>
            </div>

            <!-- Legal Name -->
            <div class="mb-3">
              <label class="form-label" for="inputLegalName" data-i18n="businesses.legal_name">Legal Name</label>
              <input
                class="form-control"
                id="inputLegalName"
                type="text"
                data-i18n-placeholder="businesses.legal_name_placeholder"
                placeholder="Enter legal name">
            </div>

            <!-- Registration No -->
            <div class="mb-3">
              <label class="form-label" for="inputRegistrationNo" data-i18n="businesses.registration_no">Registration No.</label>
              <input
                class="form-control"
                id="inputRegistrationNo"
                type="text"
                data-i18n-placeholder="businesses.registration_placeholder"
                placeholder="Enter registration number">
            </div>

            <!-- Address -->
            <div class="mb-3">
              <label class="form-label" for="inputAddress" data-i18n="people.address">Address</label>
              <textarea
                class="form-control"
                id="inputAddress"
                rows="2"
                data-i18n-placeholder="people.address_placeholder"
                placeholder="Enter address"></textarea>
            </div>

          </div>

          <!-- ========================= -->
          <!-- RIGHT COLUMN -->
          <!-- ========================= -->
          <div class="col-md-5 border-start">

            <h6 class="text-muted mb-3" data-i18n="businesses.contact_heading">Contact &amp; Currency</h6>

            <!-- Phone -->
            <div class="mb-3">
              <label class="form-label" for="inputPhone" data-i18n="common.phone">Phone</label>
              <input
                class="form-control"
                id="inputPhone"
                type="tel"
                data-i18n-placeholder="businesses.phone_placeholder"
                placeholder="Enter phone number">
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label class="form-label" for="inputBusinessEmail" data-i18n="common.email">Email</label>
              <input
                class="form-control"
                id="inputBusinessEmail"
                type="email"
                data-i18n-placeholder="businesses.email_placeholder"
                placeholder="Enter email address">
            </div>

            <!-- Currency (required) -->
            <div class="mb-3">
              <label class="form-label" for="currencySelect"><span data-i18n="common.currency">Currency</span> <span class="text-danger">*</span></label>
              <select class="form-select" id="currencySelect" required>
                <option value="" data-i18n="common.select_currency">Select a currency</option>
                <option value="USD">USD — US Dollar</option>
                <option value="EUR">EUR — Euro</option>
                <option value="GBP">GBP — British Pound</option>
                <option value="LBP">LBP — Lebanese Pound</option>
                <option value="AED">AED — UAE Dirham</option>
                <option value="SAR">SAR — Saudi Riyal</option>
                <option value="EGP">EGP — Egyptian Pound</option>
                <option value="JOD">JOD — Jordanian Dinar</option>
                <option value="KWD">KWD — Kuwaiti Dinar</option>
                <option value="TRY">TRY — Turkish Lira</option>
              </select>
            </div>

          </div>

        </div>

      </form>
    </div>

    <!-- FOOTER -->
    <div class="modal-footer">
      <button
        class="btn btn-secondary"
        type="button"
        data-bs-dismiss="modal"
        title="Close"
        data-i18n="common.close">
        Close
      </button>

      <button
        class="btn btn-primary"
        type="button"
        data-action="businesses.save"
        id="businessSaveBtn"
        title="Save business"
        data-i18n="common.save">
        Save
      </button>
    </div>

  </div>
</div>
