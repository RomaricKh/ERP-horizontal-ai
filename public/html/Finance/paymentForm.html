<!-- Payment form modal with allocation support -->
<div class="modal-dialog modal-xl modal-dialog-scrollable" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-dark text-white">
      <h5 class="modal-title" id="paymentModalTitle">
        <i class="fas fa-money-bill-wave me-2"></i><span data-i18n="payments.form_title">Payment Details</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">
      <form id="paymentForm" novalidate>

        <!-- Payee Section -->
        <div class="border rounded p-3 mb-4 bg-light">
          <h6 class="text-primary fw-bold mb-3">
            <i class="fas fa-user me-1"></i> <span data-i18n="common.payee">Payee</span>
          </h6>
          <div class="row g-3">
            <div class="col-md-12">
              <label class="form-label small text-muted" for="inputPaymentPayee"><span
                  data-i18n="common.payee">Payee</span> <span class="text-danger">*</span></label>
              <select class="form-select" id="inputPaymentPayee" required>
                <option value="" data-i18n="payments.select_payee">— Select payee —</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Payment Info Section -->
        <div class="border rounded p-3 mb-4">
          <h6 class="text-primary fw-bold mb-3">
            <i class="fas fa-file-invoice me-1"></i> <span data-i18n="payments.payment_info">Payment Info</span>
          </h6>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputPaymentNumber"><span
                  data-i18n="payments.payment_number">Payment #</span></label>
              <input class="form-control" id="inputPaymentNumber" type="text"
                data-i18n-placeholder="payments.number_placeholder" placeholder="Auto-generated if empty">
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputPaymentDate"><span
                  data-i18n="common.date">Date</span> <span class="text-danger">*</span></label>
              <input class="form-control" id="inputPaymentDate" type="date" required>
            </div>
          </div>
        </div>

        <!-- Payment Lines Section -->
        <div class="border rounded p-3 mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="text-primary fw-bold mb-0">
              <i class="fas fa-list me-1"></i> <span>Payment Lines</span>
            </h6>
            <button type="button" class="btn btn-sm btn-outline-primary" id="btnPaymentAddLine">
              <i class="fas fa-plus"></i> Add Line
            </button>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-bordered" id="paymentLinesTable">
              <thead class="table-light">
                <tr>
                  <th>Account *</th>
                  <th>Method *</th>
                  <th>Currency *</th>
                  <th>Ex. Rate *</th>
                  <th>Amount (FC) *</th>
                  <th>Amount (BC)</th>
                  <th>Notes</th>
                  <th style="width: 40px;"></th>
                </tr>
              </thead>
              <tbody id="paymentLinesBody">
                <!-- Lines added dynamically -->
              </tbody>
              <tfoot>
                <tr>
                  <td colspan="5" class="text-end fw-bold">Total (BC):</td>
                  <td class="fw-bold" id="paymentTotalBc">0.00</td>
                  <td colspan="2"></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>

        <!-- Allocation Section -->
        <div class="border rounded p-3 mb-4" id="paymentAllocationSection" style="display:none;">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h6 class="text-primary fw-bold mb-0">
              <i class="fas fa-layer-group me-1"></i> <span data-i18n="payments.allocations">Allocations</span>
            </h6>
            <div class="d-flex align-items-center gap-3">
              <span class="badge" id="paymentAllocationStatus">
                <i class="fas fa-exclamation-circle me-1"></i>Not balanced
              </span>
              <button type="button" class="btn btn-outline-primary btn-sm" id="btnAutoFillFIFO">
                <i class="fas fa-magic me-1"></i>Auto-fill FIFO
              </button>
            </div>
          </div>
          <div class="small text-muted mb-2">
            Allocated: <strong id="paymentAllocatedTotal">0.00</strong> / <strong id="paymentSlipTotal">0.00</strong>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-bordered table-hover mb-0" id="paymentAllocTable">
              <thead class="table-light">
                <tr>
                  <th style="width:30px;"></th>
                  <th>Document #</th>
                  <th>Type</th>
                  <th>Date</th>
                  <th class="text-end">Total</th>
                  <th class="text-end">Already Paid</th>
                  <th class="text-end">Remaining</th>
                  <th class="text-end" style="width:140px;">Allocate</th>
                </tr>
              </thead>
              <tbody id="paymentAllocBody">
                <tr id="paymentAllocEmpty">
                  <td colspan="8" class="text-center text-muted py-3">
                    <i class="fas fa-info-circle me-1"></i>Select a payee to see outstanding documents
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Notes -->
        <div class="mb-2">
          <label class="form-label small text-muted" for="inputPaymentNotes">
            <i class="fas fa-sticky-note me-1"></i> <span data-i18n="common.notes">Notes</span>
          </label>
          <textarea class="form-control" id="inputPaymentNotes" rows="2" data-i18n-placeholder="common.optional_notes"
            placeholder="Optional notes"></textarea>
        </div>

      </form>
    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i><span data-i18n="common.cancel">Cancel</span>
      </button>
      <button class="btn btn-primary" type="button" data-action="payments.save">
        <i class="fas fa-save me-1"></i><span data-i18n="payments.save_btn">Save Payment</span>
      </button>
    </div>

  </div>
</div>
