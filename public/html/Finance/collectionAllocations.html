<!-- Collection Allocations View Modal -->
<div class="modal-dialog modal-lg modal-dialog-scrollable" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-success text-white">
      <h5 class="modal-title" id="cAllocModalTitle">
        <i class="fas fa-layer-group me-2"></i><span>Collection Allocations</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">

      <!-- Collection Summary -->
      <div class="border rounded p-3 mb-4 bg-light">
        <div class="row g-3">
          <div class="col-md-3">
            <small class="text-muted d-block">Collection #</small>
            <strong id="cAllocSlipNumber">—</strong>
          </div>
          <div class="col-md-3">
            <small class="text-muted d-block">Date</small>
            <strong id="cAllocSlipDate">—</strong>
          </div>
          <div class="col-md-3">
            <small class="text-muted d-block">Customer</small>
            <strong id="cAllocPayeeName">—</strong>
          </div>
          <div class="col-md-3">
            <small class="text-muted d-block">Amount</small>
            <strong id="cAllocAmount" class="text-success">—</strong>
          </div>
        </div>
      </div>

      <!-- Allocations Table -->
      <div class="border rounded p-3">
        <h6 class="text-success fw-bold mb-3"><i class="fas fa-sitemap me-1"></i> Allocation Breakdown</h6>
        <div class="table-responsive">
          <table class="table table-bordered table-sm mb-0">
            <thead class="table-light">
              <tr>
                <th>Invoice</th>
                <th class="text-end">Amount (FC)</th>
                <th class="text-end">Amount (BC)</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="cAllocTableBody">
              <tr><td colspan="4" class="text-center text-muted py-3">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i>Close
      </button>
    </div>

  </div>
</div>
