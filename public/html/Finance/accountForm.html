<!-- Account form modal -->
<div class="modal-dialog modal-lg" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-primary text-white">
      <h5 class="modal-title" id="accountModalTitle">
        <i class="fas fa-university me-2"></i><span data-i18n="accounts.form_title">Account Details</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">
      <form id="accountForm" novalidate>

        <div class="border rounded p-3 mb-4 bg-light">
          <h6 class="text-primary fw-bold mb-3">
            <i class="fas fa-info-circle me-1"></i> <span data-i18n="accounts.info_heading">Account Information</span>
          </h6>
          <div class="row g-3">
            <div class="col-md-7">
              <label class="form-label small text-muted" for="inputAccountName"><span
                  data-i18n="common.name">Name</span> <span class="text-danger">*</span></label>
              <input class="form-control" id="inputAccountName" type="text"
                data-i18n-placeholder="accounts.name_placeholder" placeholder="Account name" required>
            </div>
            <div class="col-md-5">
              <label class="form-label small text-muted" for="inputAccountCurrency"><span
                  data-i18n="common.currency">Currency</span> <span class="text-danger">*</span></label>
              <select class="form-select" id="inputAccountCurrency" required>
                <option value="" data-i18n="common.select_currency">Select a currency</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="LBP">LBP</option>
                <option value="AED">AED</option>
                <option value="SAR">SAR</option>
                <option value="EGP">EGP</option>
                <option value="JOD">JOD</option>
                <option value="KWD">KWD</option>
                <option value="TRY">TRY</option>
              </select>
            </div>
          </div>
          <div class="row g-3 mt-1">
            <div class="col-md-7">
              <label class="form-label small text-muted" for="inputAccountType">Account Type <span class="text-danger">*</span></label>
              <select class="form-select" id="inputAccountType" required>
                <option value="CASH">Cash</option>
                <option value="BANK">Bank</option>
                <option value="CREDIT">Credit Card</option>
                <option value="OTHER">Other</option>
              </select>
            </div>
            <div class="col-md-5 d-flex align-items-end">
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="inputLocalCurrency">
                <label class="form-check-label small text-muted" for="inputLocalCurrency">
                  Use as Local Currency (Spillover)
                </label>
              </div>
            </div>
          </div>
          <div class="row g-3 mt-1">
            <div class="col-md-7">
              <label class="form-label small text-muted" for="inputCashDenomination">Smallest Cash Denomination</label>
              <div class="input-group">
                <input class="form-control" id="inputCashDenomination" type="number" step="1" min="0"
                  placeholder="e.g. 5000 for LBP">
                <span class="input-group-text text-muted small"><i class="fas fa-coins me-1"></i>Optional</span>
              </div>
              <div class="form-text text-muted small">
                Amounts will snap to the nearest multiple of this value (e.g. 5000 for LBP bills).
              </div>
            </div>
          </div>
        </div>

      </form>
    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i><span data-i18n="common.cancel">Cancel</span>
      </button>
      <button class="btn btn-primary" type="button" data-action="accounts.save">
        <i class="fas fa-save me-1"></i><span data-i18n="common.save">Save</span>
      </button>
    </div>

  </div>
</div>
