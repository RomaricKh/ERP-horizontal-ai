<!-- Page Heading -->
<h1 class="h3 mb-2 text-gray-800" data-i18n="payments.title">Payments</h1>

<!-- Payments DataTable -->
<div class="card shadow mb-4">
    <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
        <h6 class="m-0 font-weight-bold text-primary" data-i18n="payments.heading">Payment Slips</h6>
        <div class="d-flex gap-2">
            <button class="btn btn-primary btn-icon-split btn-sm"
                    data-action="payments.create" data-bs-toggle="tooltip" data-bs-placement="top" title="Record a new payment">
                <span class="text" data-i18n="payments.add_btn">Add Payment</span>
                <span class="icon"><i class="fas fa-fw fa-plus"></i></span>
            </button>
        </div>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover row-border"
                   id="paymentsTable" width="100%" cellspacing="0">
                <thead>
                    <tr>
                        <th data-i18n="common.id">ID</th>
                        <th data-i18n="payments.number">Number</th>
                        <th data-i18n="common.date">Date</th>
                        <th data-i18n="common.payee">Payee</th>
                        <th data-i18n="common.total_bc">Total (BC)</th>
                        <th data-i18n="common.actions">Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>
