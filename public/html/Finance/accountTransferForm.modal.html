<!-- public/html/Finance/accountTransferForm.modal.html -->
<div class="modal-dialog modal-lg" role="document">
    <div class="modal-content text-gray-800">
        <div class="modal-header bg-gradient-warning text-white">
            <h5 class="modal-title" id="transferModalTitle">
                <i class="fas fa-exchange-alt me-2"></i><span data-i18n="accounts.transfer_title">Transfer Funds</span>
            </h5>
            <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body px-4">
            <form id="accountTransferForm" novalidate>
                <div class="mb-3">
                    <label class="form-label" data-i18n="accounts.transfer_date">Transfer Date <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" id="inputTransferDate" required>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label" data-i18n="accounts.from_account">From Account <span class="text-danger">*</span></label>
                        <select class="form-select" id="selectFromAccount" required></select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" data-i18n="accounts.to_account">To Account <span class="text-danger">*</span></label>
                        <select class="form-select" id="selectToAccount" required></select>
                    </div>
                </div>

                <div class="card bg-light border-0 mb-3">
                    <div class="card-body py-2">
                        <h6 class="card-title text-muted fw-bold small text-uppercase mb-2">Source (Sending)</h6>
                        <div class="row">
                            <div class="col-md-4 mb-2">
                                <label class="form-label small mb-1" data-i18n="accounts.amount_from">Amount Sent (FC) <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" min="0" class="form-control form-control-sm" id="inputAmountFrom" required>
                            </div>
                            <div class="col-md-4 mb-2">
                                <label class="form-label small mb-1">Rate to BC <span class="text-danger">*</span></label>
                                <input type="number" step="0.000001" min="0" class="form-control form-control-sm" id="inputRateFrom" required>
                            </div>
                            <div class="col-md-4 mb-2">
                                <label class="form-label small mb-1">Equivalent (BC) <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" min="0" class="form-control form-control-sm" id="inputAmountBc" readonly tabindex="-1">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card bg-light border-0 mb-3">
                    <div class="card-body py-2">
                        <h6 class="card-title text-muted fw-bold small text-uppercase mb-2">Destination (Receiving)</h6>
                        <div class="row">
                            <div class="col-md-4 mb-2">
                                <label class="form-label small mb-1" data-i18n="accounts.amount_to">Amount Received (FC) <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" min="0" class="form-control form-control-sm" id="inputAmountTo" required>
                            </div>
                            <div class="col-md-4 mb-2">
                                <label class="form-label small mb-1">Rate from BC <span class="text-danger">*</span></label>
                                <input type="number" step="0.000001" min="0" class="form-control form-control-sm" id="inputRateTo" required>
                            </div>
                            <div class="col-md-4 mb-2">
                                <label class="form-label small mb-1">Equivalent (BC) <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" min="0" class="form-control form-control-sm" id="inputAmountBcDest" readonly tabindex="-1">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" data-i18n="common.reference">Reference</label>
                    <input type="text" class="form-control" id="inputReference" maxlength="100">
                </div>

                <div class="mb-3">
                    <label class="form-label" data-i18n="common.notes">Notes</label>
                    <textarea class="form-control" id="inputNotes" rows="2"></textarea>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-light border" type="button" data-bs-dismiss="modal" data-i18n="common.cancel">Cancel</button>
            <button type="button" class="btn btn-warning" data-action="accounts.submitTransfer">
                <i class="fas fa-fw fa-exchange-alt"></i> <span data-i18n="common.save">Complete Transfer</span>
            </button>
        </div>
    </div>
</div>
