<!-- Page Heading -->
<h1 class="h3 mb-2 text-gray-800" data-i18n="services.title">Services</h1>

<!-- Services DataTable -->
<div class="card shadow mb-4">
    <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
        <h6 class="m-0 font-weight-bold text-primary" data-i18n="services.heading">Services</h6>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm me-2" data-action="services.manage-categories">
                <i class="fas fa-tags me-1"></i> <span data-i18n="services.manage_categories">Categories</span>
            </button>
            <button class="btn btn-primary btn-icon-split btn-sm"
                    data-action="services.create" data-bs-toggle="tooltip" data-bs-placement="top" title="Create a new service">
                <span class="text" data-i18n="services.new_btn">New Service</span>
                <span class="icon"><i class="fas fa-fw fa-plus"></i></span>
            </button>
        </div>
    </div>
    <div class="card-body">
        <!-- Filters will be injected by JS next to DataTables search -->
        <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover row-border"
                   id="servicesTable" width="100%" cellspacing="0">
                <thead>
                    <tr>
                        <th data-i18n="common.id">ID</th>
                        <th data-i18n="services.name">Name</th>
                        <th data-i18n="services.category">Category</th>
                        <th data-i18n="services.unit">Unit</th>
                        <th data-i18n="services.rate">Rate</th>
                        <th data-i18n="common.status">Status</th>
                        <th data-i18n="common.actions">Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>
