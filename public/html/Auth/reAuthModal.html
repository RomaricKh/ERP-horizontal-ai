<!-- reAuth Modal-->
<div class="modal-dialog" role="document">
	<div class="modal-content text-gray-800">
		<div class="modal-header">
			<h5 class="modal-title" id="reauthModalLabel">Not ready to Leave?</h5>
			<button class="close" type="button" data-bs-dismiss="modal" aria-bs-label="Close">
				<span aria-hidden="true">×</span>
			</button>
		</div>
		<div class="modal-body">
			<form class="user" id="reauthForm">
				<div class="form-group">
					<input type="password" class="form-control form-control-user"
						id="reauthPassword" placeholder="Password">
				</div>
				<div class="error hidden" id="reauthError"></div>
				<button type="submit" class="btn btn-primary btn-user btn-block" data-action="reAuth">Stay logged in</button>
			</form>
		</div>
	</div>
</div>
