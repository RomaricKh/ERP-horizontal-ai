   <div class="container">

        <!-- Outer Row -->
        <div class="row justify-content-center">

            <div class="col-xl-10 col-lg-12 col-md-9">

                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <!-- Nested Row within Card Body -->
                        <div class="row">
                            <div class="col-lg-6 d-none d-lg-block bg-password-image"></div>
                            <div class="col-lg-6">
                                <div class="p-5">
                                    <div class="text-center">
                                        <h1 class="h4 text-gray-900 mb-2" data-i18n="auth.reset_title">Set New Password</h1>
                                        <p class="mb-4" data-i18n="auth.reset_description">Enter your new password below.</p>
                                    </div>
                                    <form class="user" id="resetPasswordForm">
                                        <div class="form-group">
                                            <input type="password" class="form-control form-control-user"
                                                id="newPassword" placeholder="New Password"
                                                data-i18n-placeholder="auth.new_password_placeholder"
                                                minlength="6" required>
                                        </div>
                                        <div class="form-group">
                                            <input type="password" class="form-control form-control-user"
                                                id="confirmPassword" placeholder="Confirm New Password"
                                                data-i18n-placeholder="auth.confirm_password_placeholder"
                                                minlength="6" required>
                                        </div>
                                        <button type="submit" class="btn btn-primary btn-user btn-block" id="resetPasswordBtn" data-i18n="auth.set_password_btn">
                                            Set New Password
                                        </button>
                                    </form>
                                    <div id="resetPasswordMessage" class="mt-3 text-center" style="display:none;"></div>
                                    <hr>
                                    <div class="text-center">
                                        <a class="small" href="#/login" data-i18n="auth.back_to_login">Back to Login</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>
