<!-- Page Heading -->
<h1 class="h3 mb-2 text-gray-800" data-i18n="recurring_salaries.title">Recurring Salaries</h1>
<p class="mb-4 text-muted">
    Manage recurring salary schedules and their payment instances.
    <a href="#/salaries" class="ms-2"><i class="fas fa-arrow-left me-1"></i>Back to Salaries</a>
</p>

<!-- Status Filter Tabs -->
<div class="mb-3">
    <div class="btn-group" role="group" aria-label="Status filter">
        <button type="button" class="btn btn-outline-primary btn-sm active" data-filter="all">All</button>
        <button type="button" class="btn btn-outline-warning btn-sm" data-filter="pending">Pending</button>
        <button type="button" class="btn btn-outline-success btn-sm" data-filter="paid">Paid</button>
        <button type="button" class="btn btn-outline-secondary btn-sm" data-filter="skipped">Skipped</button>
        <button type="button" class="btn btn-outline-danger btn-sm" data-filter="overdue">Overdue</button>
    </div>
</div>

<!-- Overdue Section -->
<div id="overdueSection" class="card border-left-danger shadow mb-4 d-none">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-danger">
            <i class="fas fa-exclamation-triangle me-1"></i>
            <span data-i18n="recurring_salaries.overdue_heading">Overdue Salaries</span>
        </h6>
    </div>
    <div class="card-body p-0">
        <div id="overdueList" class="list-group list-group-flush"></div>
    </div>
</div>

<!-- Recurring Salaries DataTable -->
<div class="card shadow mb-4">
    <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
        <h6 class="m-0 font-weight-bold text-primary" data-i18n="recurring_salaries.heading">Recurring Salary Instances</h6>
        <div class="d-flex gap-2">
            <button class="btn btn-info btn-icon-split btn-sm"
                    data-action="recurring-salaries.bulk-advance" title="Pay multiple periods in advance">
                <span class="text">Pay in Advance</span>
                <span class="icon"><i class="fas fa-fw fa-forward"></i></span>
            </button>
        </div>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover row-border"
                   id="recurringSalariesTable" width="100%" cellspacing="0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Employee</th>
                        <th>Due Date</th>
                        <th>Gross Amount</th>
                        <th>Tax</th>
                        <th>Currency</th>
                        <th>Status</th>
                        <th>Days Overdue</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>
