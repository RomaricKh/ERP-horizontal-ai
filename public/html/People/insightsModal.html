<!-- Insights modal -->
<div class="modal-dialog modal-dialog-scrollable modal-xl" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-primary text-white">
      <h5 class="modal-title" id="insightsModalTitle">
        <i class="fas fa-chart-bar me-2"></i><span>Transaction Insights</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4 py-4">

      <!-- Loading state -->
      <div id="insightsLoading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="text-muted small mt-2">Loading insights...</p>
      </div>

      <!-- Content area -->
      <div id="insightsContent" class="d-none">
        <!-- Summary badge row (populated by JS) -->
        <div id="insightsSummaryRow" class="d-none mb-3 p-3 bg-light rounded border">
        </div>
        <!-- Table for supplier/customer item insights -->
        <div id="insightsTableContainer" class="table-responsive">
          <table class="table table-bordered table-hover"
                 id="insightsTable" width="100%" cellspacing="0">
            <thead class="table-light" id="insightsTableHead"></thead>
            <tbody></tbody>
          </table>
        </div>
        <!-- General/Partner card layout -->
        <div id="insightsGeneralContainer" class="d-none"></div>
      </div>

      <!-- Empty state -->
      <div id="insightsEmpty" class="text-center py-5 d-none">
        <i class="fas fa-inbox fa-3x text-gray-300 mb-3"></i>
        <p id="insightsEmptyMessage" class="text-muted mb-0">No data found.</p>
      </div>

      <!-- Error state -->
      <div id="insightsError" class="text-center py-5 d-none">
        <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
        <p id="insightsErrorMessage" class="text-danger mb-0">Failed to load insights.</p>
      </div>

    </div>

    <div class="modal-footer bg-light">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i><span>Close</span>
      </button>
    </div>

  </div>
</div>
