<!-- Partner Equity form modal -->
<div class="modal-dialog modal-lg modal-dialog-scrollable" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-success text-white">
      <h5 class="modal-title" id="equityModalTitle">
        <i class="fas fa-handshake me-2"></i><span data-i18n="partner_equity.form_title">Record Equity Entry</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">
      <form id="equityForm" novalidate>

        <!-- Partner & Type Section -->
        <div class="border rounded p-3 mb-4 bg-light">
          <h6 class="text-warning fw-bold mb-3">
            <i class="fas fa-user-friends me-1"></i> <span data-i18n="partner_equity.partner_type">Partner & Type</span>
          </h6>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputEquityPartner"><span data-i18n="partner_equity.partner">Partner</span> <span class="text-danger">*</span></label>
              <select class="form-select" id="inputEquityPartner" required>
                <option value="" data-i18n="partner_equity.select_partner">— Select Partner —</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputEquityType"><span data-i18n="partner_equity.equity_type">Type</span> <span class="text-danger">*</span></label>
              <select class="form-select" id="inputEquityType" required>
                <option value="" data-i18n="partner_equity.select_type">— Select Type —</option>
                <option value="CONTRIBUTION" data-i18n="partner_equity.contribution">Contribution</option>
                <option value="WITHDRAWAL" data-i18n="partner_equity.withdrawal">Withdrawal</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Account & Amount Section -->
        <div class="border rounded p-3 mb-4">
          <h6 class="text-warning fw-bold mb-3">
            <i class="fas fa-calculator me-1"></i> <span data-i18n="partner_equity.account_amount">Account & Amount</span>
          </h6>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputEquityAccount"><span data-i18n="partner_equity.account">Account</span> <span class="text-danger">*</span></label>
              <select class="form-select" id="inputEquityAccount" required>
                <option value="" data-i18n="partner_equity.select_account">— Select Account —</option>
              </select>
              <small class="form-text text-muted">The business account the money flows to/from.</small>
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputEquityCurrency"><span data-i18n="common.currency">Currency</span> <span class="text-danger">*</span></label>
              <select class="form-select" id="inputEquityCurrency" required>
                <option value="" data-i18n="common.select_currency">Select a currency</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="LBP">LBP</option>
                <option value="AED">AED</option>
                <option value="SAR">SAR</option>
                <option value="EGP">EGP</option>
                <option value="JOD">JOD</option>
                <option value="KWD">KWD</option>
                <option value="TRY">TRY</option>
              </select>
            </div>
          </div>
          <div class="row g-3 mt-1">
            <div class="col-md-4">
              <label class="form-label small text-muted" for="inputEquityExchangeRate"><span data-i18n="common.exchange_rate">Exchange Rate</span> <span class="text-danger">*</span></label>
              <input class="form-control" id="inputEquityExchangeRate" type="number"
                     step="0.000000000001" min="0" placeholder="1" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted" for="inputEquityAmountFc"><span data-i18n="common.amount_fc">Amount (FC)</span> <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-coins"></i></span>
                <input class="form-control" id="inputEquityAmountFc" type="number"
                       step="0.01" min="0.01" placeholder="0.00" required>
              </div>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted" for="inputEquityAmountBc" data-i18n="common.amount_bc">Amount (BC)</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-equals"></i></span>
                <input class="form-control bg-light" id="inputEquityAmountBc" type="text"
                       readonly placeholder="Auto-calculated" tabindex="-1">
              </div>
            </div>
          </div>
        </div>

        <!-- Notes -->
        <div class="mb-2">
          <label class="form-label small text-muted" for="inputEquityNotes">
            <i class="fas fa-sticky-note me-1"></i> <span data-i18n="common.notes">Notes</span>
          </label>
          <textarea class="form-control" id="inputEquityNotes" rows="2"
                    data-i18n-placeholder="common.optional_notes" placeholder="Optional notes"></textarea>
        </div>

      </form>
    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i><span data-i18n="common.cancel">Cancel</span>
      </button>
      <button class="btn btn-warning" type="button" data-action="partnerEquity.save">
        <i class="fas fa-save me-1"></i><span data-i18n="common.save">Save</span>
      </button>
    </div>

  </div>
</div>
