<!-- Session warning banner -->
<div class="card lastWindowWarning border-bottom-warning shadow animated--fade-in" 
	 aria-labelledby="lastWindowWarning" id="lastWindowWarning">
	<div class="card-header d-flex justify-content-between align-items-center">
		<strong data-i18n="auth.session_warning">Session Warning</strong>
		<button class="close" type="button" data-action="closeSessionWarning" aria-label="Close">
			<span aria-hidden="true">×</span>
		</button>
	</div>
	<div class="card-body d-flex justify-content-between align-items-center" role="button" data-action="open.reAuth.modal">
		<span class="nav-item">
			<i class="fas fa-sign-in-alt fa-sm fa-fw mr-2 text-grey-400 text-black"></i>
			<strong data-i18n="auth.session_expiring">Your session is about to end! Click here to extend.</strong>
		</span>
	</div>
</div>
