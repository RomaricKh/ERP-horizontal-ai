<!-- Account details card-->
<div class="modal-dialog" role="document">
	<div class="modal-content text-gray-800">
		<div class="modal-header">
			<h5 class="modal-title" id="modal.title">Confirmation Modal</h5>
			<button class="btn-close" type="button" data-bs-dismiss="modal" aria-bs-label="Close"></button>
		</div>
		<div class="modal-body">
			<h5>
				<i class="text-warning fas fa-fw fa-question-circle"></i>
				<span id="confirmation.text">Confirmation text goes here!</span>
			</h5>
		</div>
        <div class="modal-footer">
			<button class="btn btn-secondary" type="button" data-bs-dismiss="modal">NO</button>
			<button class="btn btn-primary" type="button" data-action="confirmation.yes">YES</button>
		</div>
	</div>
</div>
