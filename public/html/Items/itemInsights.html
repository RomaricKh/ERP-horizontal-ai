<!-- Item Insights modal -->
<div class="modal-dialog modal-lg" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-primary text-white">
      <h5 class="modal-title" id="itemInsightsModalTitle">
        <i class="fas fa-chart-bar me-2"></i><span data-i18n="items.insights_title">Item Sales Insights</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">
      
      <!-- Item header summary -->
      <div class="d-flex align-items-center mb-3 pb-3 border-bottom">
        <div class="bg-primary text-white rounded d-flex align-items-center justify-content-center me-3" style="width: 48px; height: 48px;">
          <i class="fas fa-box fa-lg"></i>
        </div>
        <div>
          <h5 class="mb-0 fw-bold text-gray-900" id="insightsItemName">Loading...</h5>
          <div class="text-muted small" id="insightsItemSku"></div>
        </div>
      </div>

      <!-- Date Filters -->
      <div class="row align-items-end mb-4 pb-3 border-bottom g-2">
        <div class="col-md-4">
          <label class="form-label small text-muted mb-1" data-i18n="common.start_date">Start Date</label>
          <input type="date" class="form-control form-control-sm" id="insightsStartDate">
        </div>
        <div class="col-md-4">
          <label class="form-label small text-muted mb-1" data-i18n="common.end_date">End Date</label>
          <input type="date" class="form-control form-control-sm" id="insightsEndDate">
        </div>
        <div class="col-md-4">
          <button class="btn btn-sm btn-primary w-100" id="btnInsightsFilter">
            <i class="fas fa-filter me-1"></i> <span data-i18n="common.filter">Filter</span>
          </button>
        </div>
      </div>

      <div class="row">
        <!-- LEFT: Summary Metrics -->
        <div class="col-md-6">
          <div class="border rounded p-3 mb-4 bg-light">
            <h6 class="text-primary fw-bold mb-3">
              <i class="fas fa-info-circle me-1"></i> <span data-i18n="items.sales_summary">Sales Summary</span>
            </h6>
            
            <div class="row g-3">
              <div class="col-6">
                <div class="text-xs font-weight-bold text-primary text-uppercase mb-1" data-i18n="items.total_sold">Total Sold</div>
                <div class="h5 mb-0 font-weight-bold text-gray-800" id="insightsTotalSold">0</div>
              </div>
              <div class="col-6">
                <div class="text-xs font-weight-bold text-success text-uppercase mb-1" data-i18n="items.total_revenue">Total Revenue</div>
                <div class="h5 mb-0 font-weight-bold text-gray-800" id="insightsTotalRevenue">0.00</div>
              </div>
              <div class="col-12 mt-3">
                <div class="text-xs font-weight-bold text-info text-uppercase mb-1" data-i18n="items.avg_price">Avg. Selling Price</div>
                <div class="h5 mb-0 font-weight-bold text-gray-800" id="insightsAvgPrice">0.00</div>
              </div>
            </div>
          </div>

          <div class="border rounded p-3 mb-4 bg-light">
            <h6 class="text-info fw-bold mb-3">
              <i class="fas fa-shopping-cart me-1"></i> <span data-i18n="items.purchase_summary">Purchase Summary</span>
            </h6>
            
            <div class="row g-3">
              <div class="col-6">
                <div class="text-xs font-weight-bold text-info text-uppercase mb-1" data-i18n="items.total_bought">Total Bought</div>
                <div class="h5 mb-0 font-weight-bold text-gray-800" id="insightsTotalBought">0</div>
              </div>
              <div class="col-6">
                <div class="text-xs font-weight-bold text-warning text-uppercase mb-1" data-i18n="items.total_cost">Total Cost</div>
                <div class="h5 mb-0 font-weight-bold text-gray-800" id="insightsTotalCost">0.00</div>
              </div>
              <div class="col-12 mt-3">
                <div class="text-xs font-weight-bold text-secondary text-uppercase mb-1" data-i18n="items.avg_buying_price">Avg. Buying Price</div>
                <div class="h5 mb-0 font-weight-bold text-gray-800" id="insightsAvgBuyingPrice">0.00</div>
              </div>
            </div>
            
            <div class="mt-3 border-top pt-2">
              <label class="form-label small text-muted mb-0" data-i18n="items.last_bought_date">Last Bought Date</label>
              <div class="fw-bold text-gray-800" id="insightsLastBoughtDate">--</div>
            </div>
          </div>
        </div>

        <!-- RIGHT: Top Customers -->
        <div class="col-md-6">
          <div class="border rounded p-3 mb-4">
            <h6 class="text-success fw-bold mb-3">
              <i class="fas fa-users me-1"></i> <span data-i18n="items.top_customers">Top Customers</span>
            </h6>
            <div class="table-responsive">
              <table class="table table-sm table-borderless table-hover mb-0">
                <thead class="border-bottom text-muted small">
                  <tr>
                    <th class="text-start" data-i18n="common.customer">Customer</th>
                    <th class="text-center" data-i18n="items.qty">Qty</th>
                    <th class="text-end" data-i18n="items.revenue">Revenue</th>
                  </tr>
                </thead>
                <tbody id="insightsTopCustomersTbody">
                  <tr><td colspan="3" class="text-center text-muted py-3">No sales data found</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>

    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i><span data-i18n="common.close">Close</span>
      </button>
    </div>

  </div>
</div>
