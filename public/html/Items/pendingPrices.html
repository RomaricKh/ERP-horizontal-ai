<!-- Pending Prices modal -->
<div class="modal-dialog modal-dialog-scrollable modal-xl" role="document">
    <div class="modal-content text-gray-800">

        <div class="modal-header bg-gradient-info text-white">
            <h5 class="modal-title">
                <i class="fas fa-tags me-2"></i><span data-i18n="items.pending_prices_title">Pending Price Updates</span>
            </h5>
            <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body px-4">
            <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover m-0" id="pendingPricesTable" width="100%" cellspacing="0">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 40px;" class="text-center">
                                <div class="custom-control custom-checkbox">
                                    <input type="checkbox" class="custom-control-input" id="selectAllPendingPrices">
                                    <label class="custom-control-label" for="selectAllPendingPrices"></label>
                                </div>
                            </th>
                            <th>Item</th>
                            <th>Current Sale Price</th>
                            <th>Proposed Sale Price</th>
                            <th>Source</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Loaded via AJAX -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="modal-footer bg-light">
            <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
                <i class="fas fa-times me-1"></i><span data-i18n="common.close">Close</span>
            </button>
            <button type="button" class="btn btn-danger" id="btnCancelPendingPrices" disabled>
                <i class="fas fa-fw fa-trash me-1"></i> Discard Selected
            </button>
            <button type="button" class="btn btn-success" id="btnApplyPendingPrices" disabled>
                <i class="fas fa-fw fa-check me-1"></i> Apply Selected
            </button>
        </div>

    </div>
</div>
