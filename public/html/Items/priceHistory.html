<!-- Price History modal -->
<div class="modal-dialog modal-dialog-scrollable modal-xl" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-primary text-white">
      <h5 class="modal-title">
        <i class="fas fa-history me-2"></i>Price History — <span id="priceHistoryItemName">—</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4 py-4">
      <div class="table-responsive">
        <table class="table table-bordered table-hover"
               id="priceHistoryTable" width="100%" cellspacing="0">
          <thead class="table-light">
            <tr>
              <th>Date</th>
              <th>Type</th>
              <th class="text-end">Old Cost</th>
              <th class="text-end">New Cost</th>
              <th class="text-end">Old Sale</th>
              <th class="text-end">New Sale</th>
              <th>Source</th>
              <th>Changed By</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="modal-footer bg-light">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i>Close
      </button>
    </div>

  </div>
</div>
