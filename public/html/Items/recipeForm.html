<!-- Recipe Form Modal -->
<div class="modal-dialog modal-xl modal-dialog-scrollable" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-dark text-white">
      <h5 class="modal-title" id="recipeModalTitle">
        <i class="fas fa-flask me-2"></i><span data-i18n="production.recipe_form_title">New Recipe</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">

      <!-- Recipe Details -->
      <div class="border rounded p-3 mb-4 bg-light">
        <h6 class="text-dark fw-bold mb-3">
          <i class="fas fa-info-circle me-1"></i> <span data-i18n="production.recipe_details">Recipe Details</span>
        </h6>
        <form id="recipeForm" novalidate>
          <div class="row g-3">
            <div class="col-md-5">
              <label class="form-label small text-muted" for="inputRecipeName"><span data-i18n="production.manufactured_item_name">Item Name</span> <span class="text-danger">*</span></label>
              <input class="form-control" id="inputRecipeName" type="text" data-i18n-placeholder="production.recipe_name_placeholder" placeholder="e.g. Chocolate Cake" required>
            </div>
            <div class="col-md-2">
              <label class="form-label small text-muted" for="inputRecipeUnit" data-i18n="items.unit">Unit</label>
              <input class="form-control" id="inputRecipeUnit" type="text" data-i18n-placeholder="items.unit_placeholder" placeholder="pcs, kg">
            </div>
            <div class="col-md-2">
              <label class="form-label small text-muted" for="inputYieldQty"><span data-i18n="production.yield_qty">Yield</span> <span class="text-danger">*</span></label>
              <input class="form-control" id="inputYieldQty" type="number" step="0.0001" min="0.0001" value="1" required>
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted" for="inputRecipeSalePrice" data-i18n="items.sale_price">Sale Price</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-dollar-sign"></i></span>
                <input class="form-control" id="inputRecipeSalePrice" type="number" step="0.01" min="0" placeholder="0.00">
              </div>
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted" for="inputAutoMarkup" data-i18n="production.auto_markup">Auto-Markup %</label>
              <div class="input-group">
                <input class="form-control" id="inputAutoMarkup" type="number" step="0.01" min="0" placeholder="e.g. 30">
                <span class="input-group-text">%</span>
              </div>
              <small class="text-muted">Auto-calculates sale price from cost</small>
            </div>
            <div class="col-md-3">
              <label class="form-label small text-muted" for="inputRecipeMinStock">Min Stock</label>
              <input class="form-control" id="inputRecipeMinStock" type="number" step="0.01" min="0" placeholder="0.00">
            </div>
            <div class="col-md-3">
              <div class="form-check form-switch mt-4">
                <input class="form-check-input" type="checkbox" id="inputRecipeHasExpiry">
                <label class="form-check-label small fw-semibold" for="inputRecipeHasExpiry">Track Expiry</label>
              </div>
            </div>
            <div class="col-md-9">
              <label class="form-label small text-muted" for="inputRecipeNotes" data-i18n="common.notes">Notes</label>
              <textarea class="form-control" id="inputRecipeNotes" rows="1" data-i18n-placeholder="production.recipe_notes_placeholder" placeholder="Optional recipe notes"></textarea>
            </div>
          </div>
        </form>
      </div>

      <!-- Components -->
      <div class="border rounded p-3 mb-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h6 class="text-dark fw-bold mb-0">
            <i class="fas fa-cubes me-1"></i> <span data-i18n="production.component_items">Components</span>
          </h6>
          <button class="btn btn-outline-dark btn-sm" type="button" data-action="recipe.add-component">
            <i class="fas fa-plus me-1"></i><span data-i18n="production.add_component">Add</span>
          </button>
        </div>
        <div class="table-responsive">
          <table class="table table-bordered table-sm mb-0" id="recipeComponentsTable">
            <thead class="table-light">
              <tr>
                <th style="min-width:200px">Item</th>
                <th style="min-width:90px">Qty</th>
                <th style="min-width:70px">Unit</th>
                <th style="min-width:100px">Cost</th>
                <th style="min-width:100px">Total</th>
                <th style="width:45px"></th>
              </tr>
            </thead>
            <tbody id="recipeComponentsBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Cost Summary -->
      <div class="d-flex justify-content-end">
        <div class="border rounded p-3 bg-light" style="min-width:220px;">
          <div class="text-muted small">Batch Cost</div>
          <div class="fs-6 fw-semibold" id="recipeBatchCost">0.00</div>
          <hr class="my-1">
          <div class="text-muted small">Cost Per Unit</div>
          <div class="fs-5 fw-bold text-primary" id="recipeCostPerUnit">0.00</div>
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal"><i class="fas fa-times me-1"></i><span data-i18n="common.cancel">Cancel</span></button>
      <button class="btn btn-dark" type="button" data-action="recipe.save" id="recipeSaveBtn"><i class="fas fa-save me-1"></i><span data-i18n="production.save_recipe_btn">Save Recipe</span></button>
    </div>

  </div>
</div>
