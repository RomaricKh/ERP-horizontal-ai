<!-- Stock overview modal -->
<div class="modal-dialog modal-dialog-scrollable modal-xl" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-success text-white">
      <h5 class="modal-title">
        <i class="fas fa-warehouse me-2"></i><span data-i18n="items.stock_levels_title">Stock Levels</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">
      <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover"
               id="stockTable" width="100%" cellspacing="0">
          <thead class="table-light">
            <tr>
              <th data-i18n="common.item">Item</th>
              <th data-i18n="common.sku">SKU</th>
              <th data-i18n="common.type">Type</th>
              <th data-i18n="items.unit">Unit</th>
              <th data-i18n="common.quantity">Quantity</th>
              <th data-i18n="items.last_updated">Last Updated</th>
              <th data-i18n="common.actions">Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i><span data-i18n="common.close">Close</span>
      </button>
    </div>

  </div>
</div>
