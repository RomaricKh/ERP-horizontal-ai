<!-- Partner Share form modal -->
<div class="modal-dialog modal-lg modal-dialog-scrollable" role="document">
  <div class="modal-content text-gray-800">

    <div class="modal-header bg-gradient-primary text-white">
      <h5 class="modal-title" id="shareModalTitle">
        <i class="fas fa-chart-pie me-2"></i><span data-i18n="partner_shares.form_title">Partner Share Details</span>
      </h5>
      <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4">
      <form id="shareForm" novalidate>
        <input type="hidden" id="inputShareId">

        <!-- Partner & Ownership -->
        <div class="border rounded p-3 mb-4 bg-light">
          <h6 class="text-primary fw-bold mb-3">
            <i class="fas fa-user-friends me-1"></i> Partner & Ownership
          </h6>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputSharePartner"><span data-i18n="partner_shares.partner">Partner</span> <span class="text-danger">*</span></label>
              <select class="form-select" id="inputSharePartner" required>
                <option value="" data-i18n="partner_shares.select_partner">— Select partner —</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputSharePercent"><span data-i18n="partner_shares.share_percent">Share %</span> <span class="text-danger">*</span></label>
              <div class="input-group">
                <input class="form-control" id="inputSharePercent" type="number"
                       step="0.01" min="0" max="100" placeholder="0.00" required>
                <span class="input-group-text"><i class="fas fa-percent"></i></span>
              </div>
            </div>
          </div>
        </div>

        <!-- Initial Investment (only on create) -->
        <div class="border rounded p-3 mb-4" id="investmentSection">
          <h6 class="text-primary fw-bold mb-3">
            <i class="fas fa-coins me-1"></i> Initial Investment
          </h6>
          <p class="text-muted small mb-3">The invested capital will be deposited into the selected business account.</p>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputShareAccount"><span>Account</span> <span class="text-danger">*</span></label>
              <select class="form-select" id="inputShareAccount" required>
                <option value="">— Select account —</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small text-muted" for="inputShareCurrency"><span>Currency</span> <span class="text-danger">*</span></label>
              <select class="form-select" id="inputShareCurrency" required>
                <option value="">Select</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="LBP">LBP</option>
                <option value="AED">AED</option>
                <option value="SAR">SAR</option>
                <option value="EGP">EGP</option>
                <option value="JOD">JOD</option>
                <option value="KWD">KWD</option>
                <option value="TRY">TRY</option>
              </select>
            </div>
          </div>
          <div class="row g-3 mt-1">
            <div class="col-md-4">
              <label class="form-label small text-muted" for="inputShareExchangeRate"><span>Exchange Rate</span> <span class="text-danger">*</span></label>
              <input class="form-control" id="inputShareExchangeRate" type="number"
                     step="0.000001" min="0" placeholder="1.000000" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted" for="inputInvestedCapital"><span>Amount (FC)</span> <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-coins"></i></span>
                <input class="form-control" id="inputInvestedCapital" type="number"
                       step="0.01" min="0" placeholder="0.00" required>
              </div>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted" for="inputShareAmountBc">Amount (BC)</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-equals"></i></span>
                <input class="form-control bg-light" id="inputShareAmountBc" type="text"
                       readonly placeholder="Auto-calculated" tabindex="-1">
              </div>
            </div>
          </div>
        </div>

      </form>
    </div>

    <div class="modal-footer">
      <button class="btn btn-light border" type="button" data-bs-dismiss="modal">
        <i class="fas fa-times me-1"></i><span data-i18n="common.cancel">Cancel</span>
      </button>
      <button class="btn btn-primary" type="button" data-action="partnerShares.save">
        <i class="fas fa-save me-1"></i><span data-i18n="common.save">Save</span>
      </button>
    </div>

  </div>
</div>
