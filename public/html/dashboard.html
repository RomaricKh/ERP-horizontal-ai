<!-- Page Heading -->
<div class="d-sm-flex align-items-center justify-content-between mb-4">
    <h1 class="h3 mb-0 text-gray-800" data-i18n="dashboard.title">Dashboard</h1>
    <span id="dashboard-period" class="text-muted small"></span>
</div>

<!-- Stat Cards Row -->
<div class="row" id="dashboard-stat-cards">
    <!-- Revenue Card -->
    <div class="col-xl-4 col-md-6 mb-4">
        <div class="card border-left-success shadow h-100 py-2">
            <div class="card-body">
                <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                        <div class="text-xs font-weight-bold text-success text-uppercase mb-1" data-i18n="dashboard.revenue">
                            Revenue (This Month)
                        </div>
                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="stat-revenue">—</div>
                    </div>
                    <div class="col-auto">
                        <i class="fas fa-dollar-sign fa-2x text-gray-300"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Expenses Card -->
    <div class="col-xl-4 col-md-6 mb-4">
        <div class="card border-left-danger shadow h-100 py-2">
            <div class="card-body">
                <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                        <div class="text-xs font-weight-bold text-danger text-uppercase mb-1" data-i18n="dashboard.expenses">
                            Expenses (This Month)
                        </div>
                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="stat-expenses">—</div>
                    </div>
                    <div class="col-auto">
                        <i class="fas fa-receipt fa-2x text-gray-300"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Net Profit Card -->
    <div class="col-xl-4 col-md-6 mb-4">
        <div class="card border-left-primary shadow h-100 py-2">
            <div class="card-body">
                <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                        <div class="text-xs font-weight-bold text-primary text-uppercase mb-1" data-i18n="dashboard.net_profit">
                            Net Profit (This Month)
                        </div>
                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="stat-net-profit">—</div>
                    </div>
                    <div class="col-auto">
                        <i class="fas fa-chart-line fa-2x text-gray-300"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Second Row: Accounts + Low Stock -->
<div class="row">

    <!-- Account Balances -->
    <div class="col-xl-6 mb-4">
        <div class="card shadow">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary" data-i18n="dashboard.account_balances">Account Balances</h6>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-bordered table-sm mb-0" id="dashboard-accounts-table">
                        <thead class="thead-light">
                            <tr>
                                <th data-i18n="common.account">Account</th>
                                <th data-i18n="common.currency">Currency</th>
                                <th class="text-end" data-i18n="common.balance">Balance</th>
                            </tr>
                        </thead>
                        <tbody id="dashboard-accounts-body">
                            <tr><td colspan="3" class="text-center text-muted py-3" data-i18n="common.loading">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Low Stock Alerts -->
    <div class="col-xl-6 mb-4">
        <div class="card shadow">
            <div class="card-header py-3 d-flex align-items-center justify-content-between">
                <h6 class="m-0 font-weight-bold text-warning">
                    <i class="fas fa-exclamation-triangle me-1"></i> <span data-i18n="dashboard.low_stock_alerts">Low Stock Alerts</span>
                </h6>
                <span class="badge bg-warning text-dark" id="low-stock-count">0</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-bordered table-sm mb-0" id="dashboard-lowstock-table">
                        <thead class="thead-light">
                            <tr>
                                <th data-i18n="common.item">Item</th>
                                <th data-i18n="common.sku">SKU</th>
                                <th class="text-end" data-i18n="common.qty">Qty</th>
                            </tr>
                        </thead>
                        <tbody id="dashboard-lowstock-body">
                            <tr><td colspan="3" class="text-center text-muted py-3" data-i18n="common.loading">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Recent Transactions -->
<div class="row">
    <div class="col-12 mb-4">
        <div class="card shadow">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary" data-i18n="dashboard.recent_transactions">Recent Transactions</h6>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-bordered table-sm mb-0" id="dashboard-transactions-table">
                        <thead class="thead-light">
                            <tr>
                                <th data-i18n="common.type">Type</th>
                                <th data-i18n="common.date">Date</th>
                                <th data-i18n="common.description">Description</th>
                                <th class="text-end" data-i18n="common.amount_bc">Amount (BC)</th>
                            </tr>
                        </thead>
                        <tbody id="dashboard-transactions-body">
                            <tr><td colspan="4" class="text-center text-muted py-3" data-i18n="common.loading">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
